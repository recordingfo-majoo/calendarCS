                    <div className="mt-1 text-xs text-amber-600 flex items-center gap-1">
                      <span>⚠️</span>
                      <span>Durasi tidak tetap — isi waktu selesai secara manual</span>
                    </div>
                  )}
                </div>
              );
            })()}
          </div>

          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Nama / Keterangan Meeting *</label>
            <input type="text" required placeholder="cth. Majoo Cafe - INV/NEW/202601/00001" value={form.title}
              onChange={e=>set("title",e.target.value)} disabled={!canEdit}
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
          </div>
          {lockedRoomId ? (
            /* CS Role: tampilkan agent readonly */
            (() => {
              const myRoom = rooms.find(r => r.id === lockedRoomId);
              return myRoom ? (
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Customer Support Agent</label>
                  <div className="flex items-center gap-2.5 rounded-xl p-3 border-2"
                    style={{borderColor:myRoom.colorHex, backgroundColor:myRoom.colorHex+"12"}}>
                    <span className="w-3 h-3 rounded-full flex-shrink-0" style={{backgroundColor:myRoom.colorHex}}/>
                    <div>
                      <div className="text-sm font-bold text-slate-800">{myRoom.name}</div>
                      <div className="text-xs text-slate-500">📍 {myRoom.city} · {myRoom.area}</div>
                    </div>
                  </div>
                </div>
              ) : null;
            })()
          ) : (
            <AreaAgentPicker rooms={rooms} form={form} set={set} canEdit={canEdit}/>
          )}
          <div className="grid grid-cols-3 gap-3">
            <div className="col-span-3 sm:col-span-1">
              <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Tanggal *</label>
              <input type="date" required value={form.date} onChange={e=>set("date",e.target.value)} disabled={!canEdit}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Mulai *</label>
              <input type="time" required value={form.start_time} onChange={e=>set("start_time",e.target.value)} disabled={!canEdit}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Selesai *</label>
              <input type="time" required value={form.end_time} onChange={e=>set("end_time",e.target.value)} disabled={!canEdit}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
            </div>
          </div>
          {conflict && (
            <div className="bg-amber-50 border border-amber-300 rounded-lg px-4 py-3 text-sm text-amber-800 flex items-start gap-2">
              <span className="text-lg flex-shrink-0">🔀</span>
              <div>
                <strong>Waktu Bertabrakan!</strong> Sudah ada jadwal <strong>"{conflict.title}"</strong> pukul {conflict.start_time}–{conflict.end_time} oleh {conflict.booked_by_name||"pengguna lain"}.
                <br/><span className="text-amber-700">Booking tetap bisa dibuat, namun akan masuk ke <strong>antrian approval admin</strong> sebelum dikonfirmasi.</span>
              </div>
            </div>
          )}
          {!conflict && form.room_id && form.date && isHoliday(holidays||[], form.room_id, form.date) && (
            <div className="bg-amber-50 border border-amber-300 rounded-lg px-4 py-3 text-sm text-amber-800 flex items-start gap-2">
              <span className="text-lg flex-shrink-0">🏖️</span>
              <div>
                <strong>Hari Libur!</strong> Agent ini dijadwalkan libur pada tanggal tersebut.
                <br/><span className="text-amber-700">Booking tetap bisa dibuat, namun akan masuk ke <strong>antrian approval admin</strong> sebelum dikonfirmasi.</span>
              </div>
            </div>
          )}
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Peserta</label>
            <input type="text" placeholder="cth. Budi, Tim Operasional" value={form.attendees}
              onChange={e=>set("attendees",e.target.value)} disabled={!canEdit}
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Catatan</label>
            <textarea placeholder="Catatan opsional..." value={form.notes} onChange={e=>set("notes",e.target.value)}
              rows={2} disabled={!canEdit}
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none disabled:bg-slate-50"/>
          </div>

          {/* ── Status Jadwal ── */}
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Status Jadwal</label>
            <div className="flex gap-2">
              {STATUS_JADWAL_OPTS.map(s => {
                const cfg = STATUS_JADWAL_CFG[s];
                const isOn = form.status_jadwal === s;
                return (
                  <button type="button" key={s} disabled={!canEdit}
                    onClick={() => set("status_jadwal", isOn ? "" : s)}
                    className="flex-1 py-2 rounded-lg border-2 text-xs font-semibold transition-all"
                    style={isOn
                      ? { borderColor:cfg.color, backgroundColor:cfg.bg, color:cfg.color }
                      : { borderColor:"#e2e8f0", backgroundColor:"#f8fafc", color:"#94a3b8" }}>
                    {cfg.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* ── Status Assignment (admin only saat edit) ── */}
          {currentUser?.role === "admin" && isEdit && (
            <div>
              <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Status Assignment</label>
              <div className="flex gap-2">
                {Object.entries(STATUS_ASSIGN_CFG).map(([key, cfg]) => {
                  const isOn = form.status_assignment === key;
                  return (
                    <button type="button" key={key}
                      onClick={() => set("status_assignment", key)}
                      className="flex-1 py-2 rounded-lg border-2 text-xs font-semibold transition-all"
                      style={isOn
                        ? { borderColor:cfg.color, backgroundColor:cfg.bg, color:cfg.color }
                        : { borderColor:"#e2e8f0", backgroundColor:"#f8fafc", color:"#94a3b8" }}>
                      {cfg.label}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* Readonly status assignment untuk non-admin */}
          {currentUser?.role !== "admin" && form.status_assignment && STATUS_ASSIGN_CFG[form.status_assignment] && (
            <div className="flex items-center gap-2">
              <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Status Assignment:</label>
              <span className="text-xs font-bold px-2 py-1 rounded-full"
                style={{backgroundColor:STATUS_ASSIGN_CFG[form.status_assignment].bg, color:STATUS_ASSIGN_CFG[form.status_assignment].color}}>
                {STATUS_ASSIGN_CFG[form.status_assignment].label}
              </span>
            </div>
          )}

          {isEdit && initialData?.booked_by_name && (
            <div className="text-xs text-slate-400">👤 Dibooking oleh: <span className="font-medium text-slate-600">{initialData.booked_by_name}</span></div>
          )}
          <div className="flex gap-2 pt-1">
            {isEdit && canEdit && (
              <button type="button" onClick={()=>onDelete(form.id)}
                className="px-4 py-2 rounded-lg border border-red-200 text-red-500 text-sm font-medium hover:bg-red-50">
                🗑 Hapus
              </button>
            )}
            <div className="flex-1"/>
            <button type="button" onClick={onClose}
              className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">Batal</button>
            {canEdit && (
              <button type="submit" disabled={loading}
                className="px-5 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-50 shadow-sm">
                {loading ? "Menyimpan..." : isEdit?"Simpan":"Booking Sekarang"}
              </button>
            )}
          </div>
        </form>
      </div>
    </div>
  );
}

// ─── DETAIL MODAL ─────────────────────────────────────────────────────────────
function DetailModal({ booking, room, onClose, onEdit, onDelete, onUpdateStatus, onApproval, currentUser }) {
  if (!booking) return null;
  const [updatingStatus, setUpdatingStatus] = useState(false);
  const isOwner = booking.booked_by_email === currentUser?.email;
  const canAct  = isOwner || currentUser?.role === "admin";
  const isAdmin = currentUser?.role === "admin";
  // CS dapat set outcome (Reschedule/Cancel) pada booking di room mereka sendiri, meski bukan owner
  const isMyRoom = currentUser?.role === "cs" && CS_AGENT_MAP[currentUser?.email] === booking.room_id;
  const canSetOutcome = canAct || isMyRoom;

  const jadwalCfg  = STATUS_JADWAL_CFG[booking.status_jadwal];
  const assignCfg  = STATUS_ASSIGN_CFG[booking.status_assignment];
  const outcomeCfg = booking.outcome ? OUTCOME_CFG[booking.outcome] : null;

  const handleToggleAssign = async () => {
    const next = booking.status_assignment === "Need Assign CRM" ? "Done Assign CRM" : "Need Assign CRM";
    setUpdatingStatus(true);
    await onUpdateStatus(booking.id, { status_assignment: next });
    setUpdatingStatus(false);
  };

  const handleSetOutcome = async (val) => {
    // Toggle: klik lagi pada outcome yang sama → reset ke null
    const next = booking.outcome === val ? null : val;
    setUpdatingStatus(true);
    await onUpdateStatus(booking.id, { outcome: next });
    setUpdatingStatus(false);
  };

  const rows = [
    booking.sch_code   && {icon:"🔖", label:"SCH Code",   val:booking.sch_code},
    {icon:"🏢", label:"Agent",   val:room.name + (room.city ? ` — 📍 ${room.city}` : "")},
    booking.visit_type && {icon: booking.visit_type==="Online"?"🌐":"📍", label:"Type Visit", val: booking.visit_type},
    booking.activity   && {icon:"⚡", label:"Activity",  val: booking.activity},
    {icon:"📅", label:"Tanggal",val:new Date(booking.date+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})},
    {icon:"🕐", label:"Waktu",  val:`${booking.start_time} – ${booking.end_time}`},
    booking.meet_link      && {icon:"🎥",label:"Google Meet", val:booking.meet_link, isLink:true},
    booking.attendees      && {icon:"👥",label:"Peserta",        val:booking.attendees},
    booking.booked_by_name && {icon:"👤",label:"Dibooking oleh", val:booking.booked_by_name},
    booking.notes          && {icon:"📝",label:"Catatan",        val:booking.notes},
  ].filter(Boolean);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
        <div className="h-2" style={{backgroundColor:room.colorHex}}/>
        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <div>
            {booking.sch_code && <div className="text-xs font-semibold text-teal-600 mb-0.5">{booking.sch_code}</div>}
            <h2 className="text-base font-bold text-slate-800 pr-2">{booking.title}</h2>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>

        {/* Status badges row */}
        <div className="px-6 pt-4 flex flex-wrap gap-2">
          {jadwalCfg ? (
            <span className="text-xs font-bold px-2.5 py-1 rounded-full"
              style={{backgroundColor:jadwalCfg.bg, color:jadwalCfg.color}}>
              {jadwalCfg.label}
            </span>
          ) : (
            <span className="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-400">
              ⬜ Status belum diset
            </span>
          )}
          {assignCfg && (
            <span className="text-xs font-bold px-2.5 py-1 rounded-full"
              style={{backgroundColor:assignCfg.bg, color:assignCfg.color}}>
              {assignCfg.label}
            </span>
          )}
          {outcomeCfg && (
            <span className="text-xs font-bold px-2.5 py-1 rounded-full"
              style={{backgroundColor:outcomeCfg.bg, color:outcomeCfg.color}}>
              {outcomeCfg.label}
            </span>
          )}
        </div>

        {/* Approval status banner */}
        {booking.approval_status === "pending" && (
          <div className="mx-6 mt-3 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-xs text-amber-800 flex items-center gap-2">
            <span className="text-base">⏳</span>
            <div><strong>Menunggu persetujuan admin</strong><br/>Booking ini dibuat di hari libur dan perlu disetujui.</div>
          </div>
        )}
        {booking.approval_status === "rejected" && (
          <div className="mx-6 mt-3 bg-red-50 border border-red-200 rounded-xl px-4 py-3 text-xs text-red-800 flex items-center gap-2">
            <span className="text-base">❌</span>
            <div><strong>Booking ditolak</strong> oleh admin.</div>
          </div>
        )}
        {booking.approval_status === "approved" && (
          <div className="mx-6 mt-3 bg-green-50 border border-green-200 rounded-xl px-4 py-3 text-xs text-green-800 flex items-center gap-2">
            <span className="text-base">✅</span>
            <div><strong>Booking disetujui</strong> — terjadwal meskipun hari libur.</div>
          </div>
        )}

        {/* Admin: approve / reject panel */}
        {isAdmin && booking.approval_status === "pending" && (
          <div className="mx-6 mt-3 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
            <div className="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">Approval Admin</div>
            <div className="flex gap-2">
              <button onClick={()=>onApproval(booking.id,"approved")}
                className="flex-1 py-2 rounded-lg bg-green-500 text-white text-xs font-bold hover:bg-green-600 transition-colors">
                ✅ Setujui
              </button>
              <button onClick={()=>onApproval(booking.id,"rejected")}
                className="flex-1 py-2 rounded-lg bg-red-500 text-white text-xs font-bold hover:bg-red-600 transition-colors">
                ❌ Tolak
              </button>
            </div>
          </div>
        )}

        <div className="p-6 space-y-3 text-sm">
          {rows.map(r=>(
            <div key={r.label} className="flex items-start gap-3">
              <span className="w-8 text-center text-base flex-shrink-0">{r.icon}</span>
              <div>
                {r.isLink
                  ? <a href={r.val} target="_blank" rel="noopener noreferrer"
                       className="font-semibold text-blue-600 hover:underline break-all text-sm">
                      Buka Google Meet →
                    </a>
                  : <div className="font-medium text-slate-700">{r.val}</div>
                }
                <div className="text-xs text-slate-400">{r.label}</div>
              </div>
            </div>
          ))}
        </div>

        {/* Admin: quick toggle status assignment */}
        {isAdmin && (
          <div className="mx-6 mb-4 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
            <div className="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">Update Status Assignment</div>
            <button onClick={handleToggleAssign} disabled={updatingStatus}
              className="w-full py-2 rounded-lg text-xs font-bold transition-all disabled:opacity-50"
              style={booking.status_assignment === "Need Assign CRM"
                ? { backgroundColor: STATUS_ASSIGN_CFG["Done Assign CRM"].bg, color: STATUS_ASSIGN_CFG["Done Assign CRM"].color, border: `1.5px solid ${STATUS_ASSIGN_CFG["Done Assign CRM"].color}` }
                : { backgroundColor: STATUS_ASSIGN_CFG["Need Assign CRM"].bg, color: STATUS_ASSIGN_CFG["Need Assign CRM"].color, border: `1.5px solid ${STATUS_ASSIGN_CFG["Need Assign CRM"].color}` }}>
              {updatingStatus ? "Menyimpan..." : booking.status_assignment === "Need Assign CRM"
                ? "→ Tandai Done Assign CRM"
                : "→ Kembalikan ke Need Assign CRM"}
            </button>
          </div>
        )}

        {/* Reschedule / Batal outcome — visible to owner + admin + CS di room sendiri */}
        {canSetOutcome && booking.approval_status !== "rejected" && (
          <div className="mx-6 mb-4 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
            <div className="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">Update Hasil Kunjungan</div>
            <div className="flex gap-2">
              <button onClick={()=>handleSetOutcome("Reschedule")} disabled={updatingStatus}
                className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all disabled:opacity-50 border`}
                style={booking.outcome==="Reschedule"
                  ? {backgroundColor:OUTCOME_CFG.Reschedule.bg, color:OUTCOME_CFG.Reschedule.color, borderColor:OUTCOME_CFG.Reschedule.color}
                  : {backgroundColor:"#fff", color:"#92400e", borderColor:"#fcd34d"}}>
                🔄 {booking.outcome==="Reschedule" ? "✓ Reschedule (klik reset)" : "Reschedule"}
              </button>
              <button onClick={()=>handleSetOutcome("Cancel")} disabled={updatingStatus}
                className={`flex-1 py-2 rounded-lg text-xs font-bold transition-all disabled:opacity-50 border`}
                style={booking.outcome==="Cancel"
                  ? {backgroundColor:OUTCOME_CFG.Cancel.bg, color:OUTCOME_CFG.Cancel.color, borderColor:OUTCOME_CFG.Cancel.color}
                  : {backgroundColor:"#fff", color:"#dc2626", borderColor:"#fca5a5"}}>
                ❌ {booking.outcome==="Cancel" ? "✓ Batal (klik reset)" : "Batal"}
              </button>
            </div>
            {booking.outcome && (
              <p className="text-[10px] text-slate-400 mt-1.5 text-center">Klik tombol aktif untuk mereset ke jadwal normal</p>
            )}
          </div>
        )}

        {!canAct && !isMyRoom && (
          <div className="mx-6 mb-4 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-xs text-amber-800">
            Booking ini milik <strong>{booking.booked_by_name||"karyawan lain"}</strong>. Hanya pemilik atau Admin yang dapat mengubahnya.
          </div>
        )}
        {!canAct && isMyRoom && (
          <div className="mx-6 mb-4 bg-blue-50 border border-blue-200 rounded-xl px-4 py-3 text-xs text-blue-800">
            Booking ini dibuat oleh Admin. Kamu dapat mengubah status Reschedule/Cancel, namun tidak dapat mengedit detail atau menghapusnya.
          </div>
        )}
        <div className="px-6 pb-5 flex gap-2">
          <button onClick={onClose} className="flex-1 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">Tutup</button>
          {canAct && (isAdmin || isOwner) && !booking.outcome && (
            <button onClick={()=>onEdit(booking)} className="flex-1 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">Edit</button>
          )}
          {canAct && (
            <button onClick={()=>{ if(window.confirm("Hapus permanen booking ini dari sistem?")) onDelete(booking.id); }}
              className="flex-1 py-2 rounded-lg bg-red-500 text-white text-sm font-semibold hover:bg-red-600">
              Hapus
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── NOTIF HELPERS (localStorage) ────────────────────────────────────────────
function loadNotifLogs(userId) {
  try { return JSON.parse(localStorage.getItem("roombook_notifs_" + userId) || "[]"); } catch { return []; }
}
function saveNotifLogs(userId, logs) {
  try { localStorage.setItem("roombook_notifs_" + userId, JSON.stringify(logs.slice(-50))); } catch {} // simpan max 50
}
function countUnread(logs) { return logs.filter(l => !l.read).length; }

// ─── NOTIF PANEL ──────────────────────────────────────────────────────────────
function NotifPanel({ logs, onClose, onMarkAllRead, onClearAll }) {
  const unread = countUnread(logs);
  return (
    <div className="fixed inset-0 z-50 flex justify-end modal-overlay bg-black/20" onClick={onClose}>
      <div className="w-full max-w-sm bg-white shadow-2xl flex flex-col h-full" onClick={e=>e.stopPropagation()}>
        <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <h2 className="font-bold text-slate-800">🔔 Riwayat Aktivitas</h2>
            {unread > 0 && <span className="bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 font-bold">{unread} baru</span>}
          </div>
          <div className="flex items-center gap-2">
            {logs.length > 0 && <button onClick={onClearAll} className="text-xs text-slate-400 hover:text-red-500 transition-colors">Hapus Semua</button>}
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto p-4 space-y-3">
          {logs.length === 0
            ? <div className="text-center text-slate-400 text-sm py-10">Belum ada aktivitas</div>
            : [...logs].reverse().map(log => (
              <div key={log.id} className={`border rounded-xl p-3 transition-colors ${log.read ? "bg-white border-slate-100" : "bg-blue-50 border-blue-200"}`}>
                <div className="flex items-start gap-2">
                  <span className="text-lg flex-shrink-0">{log.icon}</span>
                  <div className="flex-1 min-w-0">
                    <div className={`font-semibold text-sm ${log.read ? "text-slate-700" : "text-slate-900"}`}>{log.title}</div>
                    <div className="text-xs text-slate-500 mt-0.5">{log.message}</div>
                    <div className="text-xs text-slate-400 mt-1">
                      {new Date(log.ts).toLocaleDateString("id-ID",{day:"2-digit",month:"short"})} · {new Date(log.ts).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
                    </div>
                  </div>
                  {!log.read && <div className="w-2 h-2 rounded-full bg-blue-500 flex-shrink-0 mt-1.5"></div>}
                </div>
              </div>
            ))
          }
        </div>
        {unread > 0 && (
          <div className="px-5 py-3 border-t border-slate-100">
            <button onClick={onMarkAllRead} className="w-full text-sm text-blue-600 hover:text-blue-700 font-semibold py-1">
              Tandai Semua Sudah Dibaca
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── APPROVAL PANEL ───────────────────────────────────────────────────────────
function ApprovalPanel({ bookings, onClose, onSelect }) {
  const pending = bookings.filter(b => b.approval_status === "pending")
    .sort((a, b) => (a.date + a.start_time).localeCompare(b.date + b.start_time));

  return (
    <div className="fixed inset-0 z-50 flex justify-end modal-overlay bg-black/20" onClick={onClose}>
      <div className="w-full max-w-sm bg-white shadow-2xl flex flex-col h-full" onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between bg-amber-50">
          <div className="flex items-center gap-2">
            <span className="text-xl">⏳</span>
            <h2 className="font-bold text-slate-800">Menunggu Persetujuan</h2>
            {pending.length > 0 && (
              <span className="bg-amber-500 text-white text-xs rounded-full px-1.5 py-0.5 font-bold">{pending.length}</span>
            )}
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>

        {/* List */}
        <div className="flex-1 overflow-y-auto p-4 space-y-3">
          {pending.length === 0
            ? (
              <div className="text-center py-16">
                <div className="text-4xl mb-3">✅</div>
                <div className="text-slate-400 text-sm font-medium">Tidak ada booking yang menunggu persetujuan</div>
              </div>
            )
            : pending.map(b => {
                const room = ROOMS.find(r => r.id === b.room_id);
                const dateStr = new Date(b.date + "T00:00").toLocaleDateString("id-ID", {
                  weekday: "short", day: "numeric", month: "short", year: "numeric"
                });
                return (
                  <button key={b.id} onClick={()=>{ onSelect(b); onClose(); }}
                    className="w-full text-left border border-amber-200 rounded-xl p-3.5 bg-amber-50 hover:bg-amber-100 transition-colors">
                    <div className="flex items-start gap-3">
                      {/* Color dot */}
                      <div className="w-3 h-3 rounded-full flex-shrink-0 mt-1" style={{backgroundColor: room?.colorHex || "#94a3b8"}}/>
                      <div className="flex-1 min-w-0">
                        <div className="font-semibold text-slate-800 text-sm truncate">{b.title}</div>
                        {b.sch_code && <div className="text-xs text-teal-600 font-medium truncate">{b.sch_code}</div>}
                        <div className="text-xs text-slate-500 mt-0.5">{room?.name || "Agent"}</div>
                        <div className="flex items-center gap-1.5 mt-1.5 text-xs text-slate-600">
                          <span className="bg-white border border-slate-200 rounded px-1.5 py-0.5">📅 {dateStr}</span>
                          <span className="bg-white border border-slate-200 rounded px-1.5 py-0.5">🕐 {b.start_time}–{b.end_time}</span>
                        </div>
                        {b.booked_by_name && (
                          <div className="text-xs text-slate-400 mt-1">Oleh: {b.booked_by_name}</div>
                        )}
                      </div>
                      <span className="text-slate-300 text-lg leading-none flex-shrink-0">›</span>
                    </div>
                  </button>
                );
              })
          }
        </div>

        {pending.length > 0 && (
          <div className="px-5 py-3 border-t border-slate-100 bg-slate-50">
            <p className="text-xs text-slate-400 text-center">Klik item untuk melihat detail dan memberikan persetujuan</p>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── ACCOUNT SETTINGS MODAL ───────────────────────────────────────────────────
function AccountModal({ currentUser, onClose, onUpdate }) {
  const [name,        setName]        = useState(currentUser.name || "");
  const [photo,       setPhoto]       = useState(currentUser.photo || "");
  const [oldPass,     setOldPass]     = useState("");
  const [newPass,     setNewPass]     = useState("");
  const [confirmPass, setConfirmPass] = useState("");
  const [loading,     setLoading]     = useState(false);
  const [error,       setError]       = useState("");
  const [success,     setSuccess]     = useState("");
  const [tab,         setTab]         = useState("profile"); // "profile" | "password"

  const initials = name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2) || "?";

  const handlePhotoChange = e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2*1024*1024) { setError("Foto maksimal 2MB."); return; }
    const reader = new FileReader();
    reader.onload = ev => setPhoto(ev.target.result);
    reader.readAsDataURL(file);
  };

  const saveProfile = async e => {
    e.preventDefault();
    setError(""); setSuccess(""); setLoading(true);
    try {
      if (!name.trim()) { setError("Nama tidak boleh kosong."); setLoading(false); return; }
      const newName = name.trim();
      // Simpan nama ke Supabase (tabel users)
      await supa.update("users", currentUser.id, { name: newName });
      // Update semua booking milik user ini dengan nama baru
      if (newName !== currentUser.name) {
        await fetch(`${SUPA_URL}/rest/v1/bookings?booked_by_email=eq.${encodeURIComponent(currentUser.email)}`, {
          method: "PATCH",
          headers: { ...supa.headers },
          body: JSON.stringify({ booked_by_name: newName })
        });
      }
      // Simpan foto ke localStorage
      if (photo) localStorage.setItem("roombook_photo_" + currentUser.id, photo);
      const updated = { ...currentUser, name: newName, photo: photo || currentUser.photo };
      onUpdate(updated);
      setSuccess("Profil berhasil disimpan!");
    } catch(err) { setError("Gagal menyimpan: " + err.message); }
    setLoading(false);
  };

  const savePassword = async e => {
    e.preventDefault();
    setError(""); setSuccess(""); setLoading(true);
    try {
      if (!oldPass) { setError("Masukkan password lama."); setLoading(false); return; }
      if (newPass.length < 6) { setError("Password baru minimal 6 karakter."); setLoading(false); return; }
      if (newPass !== confirmPass) { setError("Konfirmasi password tidak cocok."); setLoading(false); return; }
      // Verifikasi password lama
      const users = await supa.get("users", { id: `eq.${currentUser.id}` });
      if (!users.length || users[0].password_hash !== oldPass) { setError("Password lama salah."); setLoading(false); return; }
      await supa.update("users", currentUser.id, { password_hash: newPass });
      setOldPass(""); setNewPass(""); setConfirmPass("");
      setSuccess("Password berhasil diubah!");
    } catch(err) { setError("Gagal mengubah password: " + err.message); }
    setLoading(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:"rgba(0,0,0,0.4)"}}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h2 className="font-bold text-slate-800 text-lg">Pengaturan Akun</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>

        {/* Tabs */}
        <div className="flex border-b border-slate-100">
          {["profile","password"].map(t => (
            <button key={t} onClick={()=>{setTab(t);setError("");setSuccess("");}}
              className={`flex-1 py-2.5 text-sm font-semibold transition-colors ${tab===t?"text-blue-600 border-b-2 border-blue-600":"text-slate-400 hover:text-slate-600"}`}>
              {t==="profile" ? "Profil" : "Password"}
            </button>
          ))}
        </div>

        <div className="p-6">
          {/* Alert */}
          {error   && <div className="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3">⚠ {error}</div>}
          {success && <div className="mb-4 bg-green-50 border border-green-200 text-green-700 text-sm rounded-xl px-4 py-3">✓ {success}</div>}

          {/* Tab Profil */}
          {tab === "profile" && (
            <form onSubmit={saveProfile} className="space-y-5">
              {/* Foto */}
              <div className="flex flex-col items-center gap-3">
                <div className="relative">
                  {photo
                    ? <img src={photo} alt="avatar" className="w-20 h-20 rounded-full object-cover border-2 border-slate-200"/>
                    : <div className="w-20 h-20 rounded-full bg-blue-600 text-white text-2xl font-bold flex items-center justify-center">{initials}</div>
                  }
                  <label className="absolute -bottom-1 -right-1 bg-white border border-slate-200 rounded-full p-1.5 cursor-pointer hover:bg-slate-50 shadow-sm">
                    <svg className="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536M9 13l6.586-6.586a2 2 0 112.828 2.828L11.828 15.828A2 2 0 019 17H7v-2a2 2 0 01.586-1.414z"/></svg>
                    <input type="file" accept="image/*" onChange={handlePhotoChange} className="hidden"/>
                  </label>
                </div>
                <p className="text-xs text-slate-400">Klik ikon pensil untuk ganti foto (maks. 2MB)</p>
              </div>

              {/* Nama */}
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Nama Lengkap</label>
                <input type="text" value={name} onChange={e=>setName(e.target.value)}
                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
              </div>

              {/* Email (disabled) */}
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Email</label>
                <input type="email" value={currentUser.email} disabled
                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm bg-slate-50 text-slate-400 cursor-not-allowed"/>
                <p className="text-xs text-slate-400 mt-1">Email tidak dapat diubah.</p>
              </div>

              <button type="submit" disabled={loading}
                className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition-colors">
                {loading ? "Menyimpan..." : "Simpan Profil"}
              </button>
            </form>
          )}

          {/* Tab Password */}
          {tab === "password" && (
            <form onSubmit={savePassword} className="space-y-4">
              {[
                {label:"Password Lama", val:oldPass, set:setOldPass},
                {label:"Password Baru", val:newPass, set:setNewPass},
                {label:"Konfirmasi Password Baru", val:confirmPass, set:setConfirmPass},
              ].map(({label,val,set}) => (
                <div key={label}>
                  <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{label}</label>
                  <input type="password" value={val} onChange={e=>set(e.target.value)}
                    className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>
              ))}
              <button type="submit" disabled={loading}
                className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition-colors">
                {loading ? "Mengubah..." : "Ubah Password"}
              </button>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── GOOGLE CALENDAR HELPERS ─────────────────────────────────────────────────
function gcalEventBody(data, roomName, includeConference = false) {
  const desc = [
    `🏢 Agent: ${roomName}`,
    `${data.visit_type === "Offline" ? "📍" : "🌐"} Type Visit: ${data.visit_type || "Online"}`,
    data.activity   ? `⚡ Activity: ${data.activity}` : "",
    data.attendees  ? `👥 Peserta: ${data.attendees}` : "",
    data.notes      ? `📝 Catatan: ${data.notes}` : "",
  ].filter(Boolean).join("\n");
  const body = {
    summary: data.sch_code ? `${data.sch_code} - ${data.title}` : data.title,
    description: desc,
    start: { dateTime: `${data.date}T${data.start_time}:00`, timeZone: GCAL_TIMEZONE },
    end:   { dateTime: `${data.date}T${data.end_time}:00`,   timeZone: GCAL_TIMEZONE },
  };
  if (includeConference) {
    body.conferenceData = {
      createRequest: {
        requestId: `majoo-cs-${data.id || "new-" + Date.now()}`,
        conferenceSolutionKey: { type: "hangoutsMeet" }
      }
    };
  }
  return body;
}
// Booking Offline tidak dibuat di Google Calendar (tidak butuh Meet link)
function isOfflineVisit(data) {
  return (data.visit_type || "Online") === "Offline";
}

async function gcalCreateEvent(token, data, roomName) {
  const res = await fetch(
    "https://www.googleapis.com/calendar/v3/calendars/primary/events?conferenceDataVersion=1",
    { method: "POST", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(gcalEventBody(data, roomName, true)) }
  );
  if (!res.ok) throw new Error("Google Calendar: " + (await res.text()));
  const ev = await res.json();
  const meetLink = ev.conferenceData?.entryPoints?.find(e => e.entryPointType === "video")?.uri || "";
  return { google_event_id: ev.id, meet_link: meetLink };
}
async function gcalUpdateEvent(token, eventId, data, roomName) {
  const res = await fetch(
    `https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,
    { method: "PATCH", headers: { Authorization: `Bearer ${token}`, "Content-Type": "application/json" },
      body: JSON.stringify(gcalEventBody(data, roomName, false)) }
  );
  if (!res.ok) throw new Error("Google Calendar update: " + (await res.text()));
}
async function gcalDeleteEvent(token, eventId) {
  const res = await fetch(
    `https://www.googleapis.com/calendar/v3/calendars/primary/events/${eventId}`,
    { method: "DELETE", headers: { Authorization: `Bearer ${token}` } }
  );
  if (!res.ok && res.status !== 404 && res.status !== 410) throw new Error("Google Calendar delete: " + (await res.text()));
}

// ─── EXPORT MODAL ─────────────────────────────────────────────────────────────
function ExportModal({ onClose, bookings }) {
  const today = new Date();
  const fmt   = d => localDateStr(d);

  // Quick preset helpers
  const startOfWeek = d => { const r=new Date(d); r.setDate(d.getDate()-(d.getDay()===0?6:d.getDay()-1)); r.setHours(0,0,0,0); return r; };
  const endOfWeek   = d => { const r=new Date(startOfWeek(d)); r.setDate(r.getDate()+6); return r; };
  const startOfMonth= d => new Date(d.getFullYear(),d.getMonth(),1);
  const endOfMonth  = d => new Date(d.getFullYear(),d.getMonth()+1,0);

  const PRESETS = [
    { label:"Hari Ini",        fn:()=>({ s:fmt(today),              e:fmt(today) }) },
    { label:"Kemarin",         fn:()=>{ const d=new Date(today); d.setDate(d.getDate()-1); return {s:fmt(d),e:fmt(d)}; } },
    { label:"7 Hari Terakhir", fn:()=>{ const d=new Date(today); d.setDate(d.getDate()-6); return {s:fmt(d),e:fmt(today)}; } },
    { label:"Minggu Ini",      fn:()=>({ s:fmt(startOfWeek(today)), e:fmt(endOfWeek(today)) }) },
    { label:"Minggu Lalu",     fn:()=>{ const d=new Date(startOfWeek(today)); d.setDate(d.getDate()-7); const e=new Date(d); e.setDate(e.getDate()+6); return {s:fmt(d),e:fmt(e)}; } },
    { label:"30 Hari Terakhir",fn:()=>{ const d=new Date(today); d.setDate(d.getDate()-29); return {s:fmt(d),e:fmt(today)}; } },
    { label:"Bulan Ini",       fn:()=>({ s:fmt(startOfMonth(today)),e:fmt(endOfMonth(today)) }) },
    { label:"Bulan Lalu",      fn:()=>{ const d=new Date(today.getFullYear(),today.getMonth()-1,1); return {s:fmt(d),e:fmt(endOfMonth(d))}; } },
  ];

  const [startDate,   setStartDate]   = useState(fmt(startOfWeek(today)));
  const [endDate,     setEndDate]     = useState(fmt(endOfWeek(today)));
  const [hovered,     setHovered]     = useState(null);
  const [selecting,   setSelecting]   = useState(false); // false=pick start, true=pick end
  const [leftMonth,   setLeftMonth]   = useState(new Date(today.getFullYear(), today.getMonth()-1, 1));
  const [activePreset,setActivePreset]= useState("Minggu Ini");
  const [exporting,   setExporting]   = useState(false);

  const rightMonth = new Date(leftMonth.getFullYear(), leftMonth.getMonth()+1, 1);

  const applyPreset = p => {
    const {s,e} = p.fn();
    setStartDate(s); setEndDate(e);
    setSelecting(false);
    setActivePreset(p.label);
  };

  const handleDayClick = dateStr => {
    setActivePreset(null);
    if (!selecting) {
      setStartDate(dateStr); setEndDate(dateStr); setSelecting(true);
    } else {
      if (dateStr < startDate) { setStartDate(dateStr); setEndDate(startDate); }
      else                       { setEndDate(dateStr); }
      setSelecting(false);
    }
  };

  const isInRange = dateStr => {
    const base = selecting && hovered
      ? (hovered >= startDate ? [startDate, hovered] : [hovered, startDate])
      : [startDate, endDate];
    return dateStr >= base[0] && dateStr <= base[1];
  };

  const filtered = bookings.filter(b => b.date >= startDate && b.date <= endDate);

  const doExport = () => {
    setExporting(true);
    try {
      const rows = filtered.map((b, i) => {
        const room     = ROOMS.find(r => r.id === b.room_id);
        const dateObj  = new Date(b.date + "T00:00");
        const hari     = dateObj.toLocaleDateString("id-ID", { weekday:"long" });
        const durMin   = toMin(b.end_time) - toMin(b.start_time);
        const durJam   = (durMin / 60).toFixed(1);
        return {
          "No":              i + 1,
          "Tanggal":         b.date,
          "Hari":            hari,
          "Agent":           room?.name    || "",
          "Kota":            room?.city    || "",
          "Area":            room?.area    || "",
          "Type Visit":      b.visit_type  || "",
          "Activity":        b.activity    || "",
          "Judul Meeting":   b.title       || "",
          "Jam Mulai":       b.start_time  || "",
          "Jam Selesai":     b.end_time    || "",
          "Durasi (Jam)":    parseFloat(durJam),
          "Peserta":         b.attendees   || "",
          "Catatan":         b.notes       || "",
          "Status Jadwal":   b.status_jadwal    || "",
          "Status Assignment": b.status_assignment || "",
          "Dibooking Oleh":  b.booked_by_name  || "",
          "Email":           b.booked_by_email || "",
        };
      });

      const ws = XLSX.utils.json_to_sheet(rows);

      // Column widths
      ws["!cols"] = [
        {wch:5},{wch:12},{wch:10},{wch:28},{wch:14},{wch:14},{wch:10},{wch:30},
        {wch:30},{wch:10},{wch:10},{wch:12},{wch:25},{wch:25},{wch:22},{wch:20},{wch:22},{wch:28},
      ];

      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, "Booking CS");
      const fileName = `CS_Booking_${startDate}_sd_${endDate}.xlsx`;
      XLSX.writeFile(wb, fileName);
    } catch(e) { alert("Gagal export: " + e.message); }
    setExporting(false);
    onClose();
  };

  // Render mini calendar month
  const renderMonth = (monthDate) => {
    const year = monthDate.getFullYear(), month = monthDate.getMonth();
    const first = new Date(year, month, 1).getDay();
    const offset = first === 0 ? 6 : first - 1;
    const days   = new Date(year, month+1, 0).getDate();
    const cells  = Array(offset).fill(null).concat(Array.from({length:days},(_,i)=>i+1));
    while (cells.length % 7 !== 0) cells.push(null);

    return (
      <div className="flex-1">
        <div className="text-center font-bold text-slate-700 mb-3">
          {monthDate.toLocaleDateString("id-ID",{month:"long",year:"numeric"})}
        </div>
        <div className="grid grid-cols-7 gap-0.5 mb-1">
          {["Sen","Sel","Rab","Kam","Jum","Sab","Min"].map(d=>(
            <div key={d} className="text-center text-xs text-slate-400 font-semibold py-1">{d}</div>
          ))}
        </div>
        <div className="grid grid-cols-7 gap-0.5">
          {cells.map((day, idx) => {
            if (!day) return <div key={idx}/>;
            const dateStr = `${year}-${String(month+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;
            const inRange = isInRange(dateStr);
            const isStart = dateStr === startDate;
            const isEnd   = dateStr === (selecting && hovered ? (hovered >= startDate ? hovered : startDate) : endDate);
            const isTod   = dateStr === fmt(today);
            const isPast  = dateStr < fmt(today);
            return (
              <button key={idx} onClick={() => handleDayClick(dateStr)}
                onMouseEnter={() => selecting && setHovered(dateStr)}
                onMouseLeave={() => selecting && setHovered(null)}
                className={`text-center text-xs py-1.5 rounded-lg transition-all font-medium
                  ${isStart||isEnd ? "text-white font-bold" : ""}
                  ${inRange && !isStart && !isEnd ? "bg-teal-50 text-teal-700 rounded-none" : ""}
                  ${!inRange && !isStart && !isEnd ? (isTod ? "text-teal-600 font-bold" : isPast ? "text-slate-300" : "text-slate-600 hover:bg-slate-100") : ""}
                `}
                style={(isStart||isEnd) ? {backgroundColor:"#2DBDB6"} : {}}>
                {day}
              </button>
            );
          })}
        </div>
      </div>
    );
  };

  const fmtDisplay = d => new Date(d+"T00:00").toLocaleDateString("id-ID",{day:"numeric",month:"short",year:"numeric"});

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/40" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-3xl mx-4 overflow-hidden fade-in" onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <div>
            <h2 className="text-base font-bold text-slate-800">📊 Export Data Booking</h2>
            <p className="text-xs text-slate-400 mt-0.5">Pilih rentang tanggal lalu export ke Excel</p>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>

        <div className="flex">
          {/* Left: presets */}
          <div className="w-44 border-r border-slate-100 p-3 flex-shrink-0">
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2 px-2">Preset</div>
            <div className="space-y-0.5">
              {PRESETS.map(p => (
                <button key={p.label} onClick={() => applyPreset(p)}
                  className={`w-full text-left px-3 py-2 rounded-lg text-sm transition-colors font-medium
                    ${activePreset===p.label
                      ? "bg-teal-500 text-white"
                      : "text-slate-600 hover:bg-slate-50"}`}>
                  {p.label}
                </button>
              ))}
            </div>
          </div>

          {/* Right: dual calendar */}
          <div className="flex-1 p-5">
            {/* Month navigation */}
            <div className="flex items-center justify-between mb-4">
              <button onClick={()=>setLeftMonth(new Date(leftMonth.getFullYear(),leftMonth.getMonth()-1,1))}
                className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="15 18 9 12 15 6"/></svg>
              </button>
              <button onClick={()=>setLeftMonth(new Date(leftMonth.getFullYear(),leftMonth.getMonth()+1,1))}
                className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors ml-auto">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>
              </button>
            </div>

            {/* Two months */}
            <div className="flex gap-6">
              {renderMonth(leftMonth)}
              <div className="w-px bg-slate-100 flex-shrink-0"/>
              {renderMonth(rightMonth)}
            </div>
          </div>
        </div>

        {/* Footer */}
        <div className="px-6 py-4 border-t border-slate-100 flex items-center justify-between">
          <div className="text-sm text-slate-600">
            <span className="font-semibold text-teal-600">{fmtDisplay(startDate)}</span>
            <span className="text-slate-400 mx-2">→</span>
            <span className="font-semibold text-teal-600">{fmtDisplay(endDate)}</span>
            <span className="text-slate-400 ml-3">·</span>
            <span className="ml-2 text-slate-500"><strong className="text-slate-700">{filtered.length}</strong> data</span>
          </div>
          <div className="flex gap-2">
            <button onClick={onClose} className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">Batal</button>
            <button onClick={doExport} disabled={exporting || filtered.length === 0}
              className="px-5 py-2 rounded-xl bg-teal-500 hover:bg-teal-600 text-white text-sm font-bold transition-colors disabled:opacity-50 flex items-center gap-2 shadow-sm">
              {exporting ? "Mengexport..." : `⬇ Export Excel (${filtered.length})`}
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── KPI DETAIL MODAL ─────────────────────────────────────────────────────────
// Popup detail saat salah satu KPI tile di dashboard diklik.
function KpiDetailModal({ type, bookings, bookingHours, onClose }) {
  const agentName = id => ROOMS.find(r => String(r.id) === String(id))?.name || "—";
  const fmtTgl = d => {
    if (!d) return "—";
    const dt = new Date(d + "T00:00:00");
    return isNaN(dt) ? d : dt.toLocaleDateString("id-ID", { day:"2-digit", month:"short", year:"numeric" });
  };
  const fmtJam = h => (h % 1 === 0 ? String(h) : h.toFixed(1));

  const cfg = {
    total:      { icon:"📋", title:"Total Booking",  rows: bookings },
    online:     { icon:"🌐", title:"Booking Online", rows: bookings.filter(b => (b.visit_type||"Online") !== "Offline") },
    offline:    { icon:"📍", title:"Booking Offline",rows: bookings.filter(b => b.visit_type === "Offline") },
    totalHours: { icon:"⏱️", title:"Total Hours",   rows: bookings },
    uniqAct:    { icon:"⚡", title:"Jenis Activity" },
  }[type] || { icon:"", title:"Detail" };

  // Daftar jenis activity + jumlah (khusus tile Jenis Activity)
  const actRows = (() => {
    if (type !== "uniqAct") return [];
    const c = {};
    bookings.forEach(b => { if (b.activity) c[b.activity] = (c[b.activity]||0)+1; });
    return Object.entries(c).sort((a,b)=>b[1]-a[1]);
  })();

  const rows     = cfg.rows ? [...cfg.rows].sort((a,b)=>(a.date||"").localeCompare(b.date||"")) : [];
  const showJam  = type === "totalHours";
  const totalJam = showJam ? rows.reduce((s,b)=>s+bookingHours(b),0) : 0;

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 max-h-[85vh] overflow-y-auto"
        onClick={e=>e.stopPropagation()}>
        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
          <h2 className="text-lg font-bold text-slate-800">{cfg.icon} Detail {cfg.title}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>
        <div className="p-5">

          {type === "uniqAct" ? (
            actRows.length === 0
              ? <div className="py-10 text-center text-slate-400 text-sm">Tidak ada data di rentang ini</div>
              : <table className="w-full text-sm">
                  <thead>
                    <tr className="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider border-b border-slate-100">
                      <th className="px-3 py-2 text-left font-semibold">Jenis Activity</th>
                      <th className="px-3 py-2 text-center font-semibold">Jumlah Booking</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-50">
                    {actRows.map(([name,count])=>(
                      <tr key={name} className="hover:bg-slate-50">
                        <td className="px-3 py-2 text-slate-700 font-medium">{name}</td>
                        <td className="px-3 py-2 text-center font-semibold text-purple-600">{count}</td>
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr className="bg-slate-50 border-t-2 border-slate-200 font-bold">
                      <td className="px-3 py-2 text-slate-700">{actRows.length} jenis activity</td>
                      <td className="px-3 py-2 text-center text-slate-800">{actRows.reduce((s,[,c])=>s+c,0)}</td>
                    </tr>
                  </tfoot>
                </table>
          ) : (
            rows.length === 0
              ? <div className="py-10 text-center text-slate-400 text-sm">Tidak ada data di rentang ini</div>
              : <table className="w-full text-sm">
                  <thead>
                    <tr className="bg-slate-50 text-xs text-slate-500 uppercase tracking-wider border-b border-slate-100">
                      <th className="px-3 py-2 text-left font-semibold">Tanggal</th>
                      <th className="px-3 py-2 text-left font-semibold">SCH Code</th>
                      <th className="px-3 py-2 text-left font-semibold">Nama Meeting</th>
                      <th className="px-3 py-2 text-left font-semibold">Agent</th>
                      {showJam && <th className="px-3 py-2 text-center font-semibold">Jam</th>}
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-slate-50">
                    {rows.map(b=>(
                      <tr key={b.id} className="hover:bg-slate-50">
                        <td className="px-3 py-2 text-slate-600 whitespace-nowrap">{fmtTgl(b.date)}</td>
                        <td className="px-3 py-2 text-slate-600">{b.sch_code || "—"}</td>
                        <td className="px-3 py-2 text-slate-700 font-medium">{b.title || "—"}</td>
                        <td className="px-3 py-2 text-slate-600">{agentName(b.room_id)}</td>
                        {showJam && <td className="px-3 py-2 text-center font-semibold text-indigo-600">{fmtJam(bookingHours(b))}</td>}
                      </tr>
                    ))}
                  </tbody>
                  <tfoot>
                    <tr className="bg-slate-50 border-t-2 border-slate-200 font-bold">
                      <td className="px-3 py-2 text-slate-700" colSpan={4}>{rows.length} booking</td>
                      {showJam && <td className="px-3 py-2 text-center text-indigo-600">{fmtJam(totalJam)} jam</td>}
                    </tr>
                  </tfoot>
                </table>
          )}

        </div>
      </div>
    </div>
  );
}

// ─── DASHBOARD PAGE ───────────────────────────────────────────────────────────
function DashboardPage({ bookings, currentUser }) {
  const today = new Date();
  const fmtDate = d => {
    const y = d.getFullYear(), m = String(d.getMonth()+1).padStart(2,'0'), day = String(d.getDate()).padStart(2,'0');
    return `${y}-${m}-${day}`;
  };
  const firstOfMonth  = () => fmtDate(new Date(today.getFullYear(), today.getMonth(), 1));
  const lastOfMonth   = () => fmtDate(new Date(today.getFullYear(), today.getMonth()+1, 0));

  // CS Agent: locked ke agent mereka sendiri
  const isCS      = currentUser?.role === "cs";
  const csRoomId  = isCS ? String(CS_AGENT_MAP[currentUser?.email] ?? "") : null;

  const [selectedAgent, setSelectedAgent] = useState(() => isCS ? (csRoomId || "all") : "all");
  const [dateFrom, setDateFrom]           = useState(firstOfMonth);
  const [dateTo,   setDateTo]             = useState(lastOfMonth);
  const [detailKey,  setDetailKey]  = useState(null);   // KPI tile semua jadwal
  const [detailKeyQ, setDetailKeyQ] = useState(null);   // KPI tile realisasi

  const colChartRef  = useRef(null);
  const actChartRef  = useRef(null);
  const colChartRef2 = useRef(null);
  const actChartRef2 = useRef(null);

  const applyPreset = (type) => {
    if (type === "today") {
      setDateFrom(fmtDate(today)); setDateTo(fmtDate(today));
    } else if (type === "yesterday") {
      const y = new Date(today); y.setDate(y.getDate()-1);
      setDateFrom(fmtDate(y)); setDateTo(fmtDate(y));
    } else if (type === "week") {
      const w = new Date(today), day = w.getDay();   // 0=Minggu .. 6=Sabtu
      w.setDate(w.getDate() - (day===0?6:day-1));     // mundur ke Senin
      setDateFrom(fmtDate(w)); setDateTo(fmtDate(today));
    } else if (type === "month") {
      // Full bulan: 1 - hari terakhir bulan ini
      setDateFrom(fmtDate(new Date(today.getFullYear(), today.getMonth(), 1)));
      setDateTo(fmtDate(new Date(today.getFullYear(), today.getMonth()+1, 0)));
    } else if (type === "year") {
      setDateFrom(fmtDate(new Date(today.getFullYear(), 0, 1)));
      setDateTo(fmtDate(new Date(today.getFullYear(), 11, 31)));
    }
  };

  // Filtered bookings by agent + date
  const filtered = useMemo(() => bookings.filter(b => {
    const inAgent = selectedAgent === "all" || String(b.room_id) === selectedAgent;
    const inDate  = (!dateFrom || b.date >= dateFrom) && (!dateTo || b.date <= dateTo);
    return inAgent && inDate;
  }), [bookings, selectedAgent, dateFrom, dateTo]);

  // Index jam dari ACTIVITY_LIST untuk sebuah booking.
  // Cocokkan berdasarkan nama activity + visit_type (atau "Both").
  // Activity dengan duration 0 ("durasi manual") dihitung 0 jam.
  const bookingHours = b => {
    if (!b.activity) return 0;
    const vt = b.visit_type || "Online";
    const act = ACTIVITY_LIST.find(a => a.name === b.activity && (a.type === vt || a.type === "Both"));
    return act ? act.duration : 0;
  };

  // KPI — Semua jadwal
  const kpis = useMemo(() => ({
    total:    filtered.length,
    online:   filtered.filter(b => (b.visit_type||"Online") !== "Offline").length,
    offline:  filtered.filter(b => b.visit_type === "Offline").length,
    uniqAct:  new Set(filtered.map(b=>b.activity).filter(Boolean)).size,
    totalHours: filtered.reduce((s,b) => s + bookingHours(b), 0),
  }), [filtered]);

  // Realisasi = Done Assign CRM & bukan Reschedule/Cancel
  const filteredQ = useMemo(() =>
    filtered.filter(b => b.status_assignment === "Done Assign CRM" && b.outcome !== "Reschedule" && b.outcome !== "Cancel"),
  [filtered]);

  const kpisQ = useMemo(() => ({
    total:      filteredQ.length,
    online:     filteredQ.filter(b => (b.visit_type||"Online") !== "Offline").length,
    offline:    filteredQ.filter(b => b.visit_type === "Offline").length,
    uniqAct:    new Set(filteredQ.map(b=>b.activity).filter(Boolean)).size,
    totalHours: filteredQ.reduce((s,b) => s + bookingHours(b), 0),
    reschedule: filtered.filter(b => b.outcome === "Reschedule").length,
    cancel:     filtered.filter(b => b.outcome === "Cancel").length,
  }), [filteredQ, filtered]);

  // Monthly chart data (stacked Online/Offline)
  const monthlyData = useMemo(() => {
    const map = {};
    filtered.forEach(b => {
      const key = b.date.substring(0,7);
      if (!map[key]) map[key] = { online:0, offline:0 };
      b.visit_type === "Offline" ? map[key].offline++ : map[key].online++;
    });
    const keys = Object.keys(map).sort();
    return {
      labels:  keys.map(k => { const [y,m]=k.split("-"); return new Date(Number(y),Number(m)-1).toLocaleDateString("id-ID",{month:"short",year:"2-digit"}); }),
      online:  keys.map(k=>map[k].online),
      offline: keys.map(k=>map[k].offline),
    };
  }, [filtered]);

  // Activity breakdown (sorted desc)
  const activityData = useMemo(() => {
    const counts = {};
    filtered.forEach(b => { if(b.activity) counts[b.activity] = (counts[b.activity]||0)+1; });
    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    return {
      labels: sorted.map(([a]) => a.length>32 ? a.substring(0,32)+"…" : a),
      data:   sorted.map(([,c]) => c),
    };
  }, [filtered]);

  // Realisasi charts
  const monthlyDataQ = useMemo(() => {
    const map = {};
    filteredQ.forEach(b => {
      const key = b.date.substring(0,7);
      if (!map[key]) map[key] = { online:0, offline:0 };
      b.visit_type === "Offline" ? map[key].offline++ : map[key].online++;
    });
    const keys = Object.keys(map).sort();
    return {
      labels:  keys.map(k => { const [y,m]=k.split("-"); return new Date(Number(y),Number(m)-1).toLocaleDateString("id-ID",{month:"short",year:"2-digit"}); }),
      online:  keys.map(k=>map[k].online),
      offline: keys.map(k=>map[k].offline),
    };
  }, [filteredQ]);

  const activityDataQ = useMemo(() => {
    const counts = {};
    filteredQ.forEach(b => { if(b.activity) counts[b.activity] = (counts[b.activity]||0)+1; });
    const sorted = Object.entries(counts).sort((a,b)=>b[1]-a[1]);
    return {
      labels: sorted.map(([a]) => a.length>32 ? a.substring(0,32)+"…" : a),
      data:   sorted.map(([,c]) => c),
    };
  }, [filteredQ]);

  // All-agents summary table (date-filtered only)
  const agentSummary = useMemo(() => {
    const df = bookings.filter(b => (!dateFrom||b.date>=dateFrom) && (!dateTo||b.date<=dateTo));
    return ROOMS.map(room => {
      const rb = df.filter(b => String(b.room_id)===String(room.id));
      const rbQ = rb.filter(b => b.status_assignment==="Done Assign CRM" && b.outcome!=="Reschedule" && b.outcome!=="Cancel");
      const cmap = {}; rb.forEach(b=>{if(b.activity) cmap[b.activity]=(cmap[b.activity]||0)+1;});
      const topAct = Object.entries(cmap).sort((a,b)=>b[1]-a[1])[0]?.[0] || "—";
      return {
        room,
        total:rb.length, online:rb.filter(b=>(b.visit_type||"Online")!=="Offline").length, offline:rb.filter(b=>b.visit_type==="Offline").length, hours:rb.reduce((s,b)=>s+bookingHours(b),0),
        realisasi: rbQ.length, realisasiHours: rbQ.reduce((s,b)=>s+bookingHours(b),0),
        reschedule: rb.filter(b=>b.outcome==="Reschedule").length,
        cancel: rb.filter(b=>b.outcome==="Cancel").length,
        topAct,
      };
    }).sort((a,b)=>b.total-a.total);
  }, [bookings, dateFrom, dateTo]);
  const grandTotal      = agentSummary.reduce((s,a)=>s+a.total,      0);
  const grandOnline     = agentSummary.reduce((s,a)=>s+a.online,     0);
  const grandOffline    = agentSummary.reduce((s,a)=>s+a.offline,    0);
  const grandHours      = agentSummary.reduce((s,a)=>s+a.hours,      0);
  const grandRealisasi  = agentSummary.reduce((s,a)=>s+a.realisasi,  0);
  const grandReschedule = agentSummary.reduce((s,a)=>s+a.reschedule, 0);
  const grandCancel     = agentSummary.reduce((s,a)=>s+a.cancel,     0);
  // Format jam: bilangan bulat tanpa desimal, selain itu 1 angka di belakang koma
  const fmtHours = h => (h % 1 === 0 ? String(h) : h.toFixed(1));

  // Target working hours (prorata HKE) — per individu & nasional (semua agent)
  const targetIndividual = useMemo(() => proratedTarget(dateFrom, dateTo), [dateFrom, dateTo]);
  const targetNasional   = targetIndividual * ROOMS.length;
  // Target sesuai filter: 1 agent → individu, "Semua Agent" → nasional
  const targetScope    = selectedAgent === "all" ? targetNasional : targetIndividual;
  const progressPct    = targetScope > 0 ? (kpis.totalHours / targetScope) * 100 : 0;
  const progressPctQ   = targetScope > 0 ? (kpisQ.totalHours / targetScope) * 100 : 0;
  const nasionalPct    = targetNasional > 0 ? (grandHours / targetNasional) * 100 : 0;

  // Column chart
  useEffect(() => {
    if (!colChartRef.current) return;
    const existing = Chart.getChart(colChartRef.current);
    if (existing) existing.destroy();
    if (!monthlyData.labels.length) return;
    new Chart(colChartRef.current, {
      type: "bar",
      data: {
        labels: monthlyData.labels,
        datasets: [
          { label:"Online 🌐",  data:monthlyData.online,  backgroundColor:"#2DBDB6", borderRadius:5 },
          { label:"Offline 📍", data:monthlyData.offline, backgroundColor:"#f59e0b", borderRadius:5 },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:"top" } },
        scales:{
          x:{ stacked:true, grid:{ display:false } },
          y:{ stacked:true, beginAtZero:true, ticks:{ precision:0 } }
        }
      }
    });
  }, [monthlyData]);

  // Activity chart (horizontal bar)
  useEffect(() => {
    if (!actChartRef.current) return;
    const existing = Chart.getChart(actChartRef.current);
    if (existing) existing.destroy();
    if (!activityData.labels.length) return;
    new Chart(actChartRef.current, {
      type: "bar",
      data: {
        labels: activityData.labels,
        datasets:[{
          label:"Jumlah",
          data: activityData.data,
          backgroundColor: activityData.data.map((_,i)=>`hsl(${166+i*9},${55-i%3*5}%,${46+i%4*4}%)`),
          borderRadius:4,
        }]
      },
      options: {
        indexAxis:"y", responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } }, y:{ grid:{ display:false } } }
      }
    });
  }, [activityData]);

  // Realisasi charts useEffect
  useEffect(() => {
    if (!colChartRef2.current) return;
    const existing = Chart.getChart(colChartRef2.current);
    if (existing) existing.destroy();
    if (!monthlyDataQ.labels.length) return;
    new Chart(colChartRef2.current, {
      type: "bar",
      data: {
        labels: monthlyDataQ.labels,
        datasets: [
          { label:"Online 🌐",  data:monthlyDataQ.online,  backgroundColor:"#2DBDB6", borderRadius:5 },
          { label:"Offline 📍", data:monthlyDataQ.offline, backgroundColor:"#f59e0b", borderRadius:5 },
        ]
      },
      options: {
        responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ position:"top" } },
        scales:{ x:{ stacked:true, grid:{ display:false } }, y:{ stacked:true, beginAtZero:true, ticks:{ precision:0 } } }
      }
    });
  }, [monthlyDataQ]);

  useEffect(() => {
    if (!actChartRef2.current) return;
    const existing = Chart.getChart(actChartRef2.current);
    if (existing) existing.destroy();
    if (!activityDataQ.labels.length) return;
    new Chart(actChartRef2.current, {
      type: "bar",
      data: {
        labels: activityDataQ.labels,
        datasets:[{ label:"Jumlah", data:activityDataQ.data,
          backgroundColor: activityDataQ.data.map((_,i)=>`hsl(${142+i*9},${55-i%3*5}%,${42+i%4*4}%)`),
          borderRadius:4 }]
      },
      options: {
        indexAxis:"y", responsive:true, maintainAspectRatio:false,
        plugins:{ legend:{ display:false } },
        scales:{ x:{ beginAtZero:true, ticks:{ precision:0 } }, y:{ grid:{ display:false } } }
      }
    });
  }, [activityDataQ]);

  const selectedRoom = ROOMS.find(r=>String(r.id)===selectedAgent);

  return (
    <div className="flex-1 overflow-y-auto bg-slate-50 p-5">
      <div className="max-w-6xl mx-auto space-y-5">

        {/* Title */}
        <div>
          <h1 className="text-xl font-bold text-slate-800">📊 Dashboard Activity</h1>
          <p className="text-sm text-slate-500 mt-0.5">Ringkasan aktivitas Customer Support berdasarkan data booking</p>
        </div>

        {/* Filter Bar */}
        <div className="bg-white rounded-2xl border border-slate-200 shadow-sm p-4">
          <div className="flex flex-wrap items-end gap-3">
            {isCS ? (
              /* CS: tampilkan nama agent mereka, tidak bisa diganti */
              <div>
                <label className="text-xs font-semibold text-slate-500 mb-1 block uppercase tracking-wider">Agent</label>
                <div className="border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 bg-slate-50 min-w-[200px] flex items-center gap-2">
                  <div className="w-2 h-2 rounded-full flex-shrink-0" style={{backgroundColor: ROOMS.find(r=>String(r.id)===csRoomId)?.colorHex || "#64748b"}}/>
                  {ROOMS.find(r=>String(r.id)===csRoomId)?.name || "—"}
                </div>
              </div>
            ) : (
              <div>
                <label className="text-xs font-semibold text-slate-500 mb-1 block uppercase tracking-wider">Agent</label>
                <select value={selectedAgent} onChange={e=>setSelectedAgent(e.target.value)}
                  className="border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 bg-white focus:outline-none focus:ring-2 focus:ring-teal-400 min-w-[200px]">
                  <option value="all">Semua Agent</option>
                  {ROOMS.map(r=>(
                    <option key={r.id} value={String(r.id)}>{r.name}{r.city?` — ${r.city}`:""}</option>
                  ))}
                </select>
              </div>
            )}
            <div>
              <label className="text-xs font-semibold text-slate-500 mb-1 block uppercase tracking-wider">Dari</label>
              <input type="date" value={dateFrom} onChange={e=>setDateFrom(e.target.value)}
                className="border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-400"/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 mb-1 block uppercase tracking-wider">Sampai</label>
              <input type="date" value={dateTo} onChange={e=>setDateTo(e.target.value)}
                className="border border-slate-200 rounded-xl px-3 py-2 text-sm text-slate-700 focus:outline-none focus:ring-2 focus:ring-teal-400"/>
            </div>
            <div>
              <label className="text-xs font-semibold text-slate-500 mb-1 block uppercase tracking-wider">Preset</label>
              <div className="flex gap-1.5 flex-wrap">
                {[["today","Hari Ini"],["yesterday","Kemarin"],["week","Minggu Ini"],["month","Bulan Ini"],["year","Tahun Ini"]].map(([t,l])=>(
                  <button key={t} onClick={()=>applyPreset(t)}
                    className="px-3 py-2 text-xs font-semibold rounded-xl border border-slate-200 text-slate-600 hover:bg-teal-50 hover:border-teal-300 hover:text-teal-700 transition-colors">
                    {l}
                  </button>
                ))}
              </div>
            </div>
          </div>
        </div>

        {/* ── SECTION 1: Semua Jadwal ── */}
        <div className="flex items-center gap-3">
          <div className="flex-1 h-px bg-slate-200"/>
          <span className="text-xs font-bold text-slate-500 uppercase tracking-wider px-2">📋 Semua Jadwal</span>
          <div className="flex-1 h-px bg-slate-200"/>
        </div>

        {/* KPI Cards */}
        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-6 gap-4">
          {[
            { id:"total",      icon:"📋", label:"Total Booking",   val:kpis.total,   clr:"text-blue-600",   bg:"bg-blue-50",   border:"border-blue-200" },
            { id:"online",     icon:"🌐", label:"Online",           val:kpis.online,  clr:"text-teal-600",   bg:"bg-teal-50",   border:"border-teal-200" },
            { id:"offline",    icon:"📍", label:"Offline",          val:kpis.offline, clr:"text-amber-600",  bg:"bg-amber-50",  border:"border-amber-200" },

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function localDateStr(d) {
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayStr() { return localDateStr(new Date()); }
function toMin(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }
function getWeekDays(base) {
  const d = new Date(base), day = d.getDay();
  const mon = new Date(d);
  mon.setDate(d.getDate() - (day === 0 ? 6 : day - 1));
  return Array.from({length:7}, (_,i) => { const dd = new Date(mon); dd.setDate(mon.getDate()+i); return dd; });
}
const HOURS = Array.from({length:13}, (_,i) => `${String(i+8).padStart(2,"0")}:00`);

function computeColumns(dayBookings) {
  const sorted = [...dayBookings].sort((a,b) => toMin(a.start_time) - toMin(b.start_time));
  const colEnds = [];
  const withCol = sorted.map(b => {
    const bS = toMin(b.start_time), bE = toMin(b.end_time);
    let col = colEnds.findIndex(e => e <= bS);
    if (col === -1) { col = colEnds.length; colEnds.push(bE); } else { colEnds[col] = bE; }
    return { ...b, col };
  });
  return withCol.map(b => {
    const bS = toMin(b.start_time), bE = toMin(b.end_time);
    const overlapping = withCol.filter(o => bS < toMin(o.end_time) && bE > toMin(o.start_time));
    return { ...b, totalCols: Math.max(...overlapping.map(o => o.col)) + 1 };
  });
}

function isHoliday(holidays, roomId, dateStr) {
  const room = ROOMS.find(r => r.id === roomId);
  return holidays.some(h =>
    h.date === dateStr && (
      h.room_id === roomId ||
      (h.area === room?.area && !h.room_id) ||
      (!h.room_id && !h.area)
    )
  );
}

// ─── BOOKING CHIP (read-only) ─────────────────────────────────────────────────
function BookingChip({ booking, room, col, totalCols, onClick }) {
  const SLOT_H   = 56;
  const start    = toMin(booking.start_time) - toMin("08:00");
  const duration = toMin(booking.end_time)   - toMin(booking.start_time);
  const top    = (start / 60) * SLOT_H;
  const height = Math.max((duration / 60) * SLOT_H - 4, 24);
  const GAP    = 2;
  return (
    <div className="absolute rounded-lg px-2 py-1 booking-chip cursor-pointer shadow-sm hover:shadow-md hover:z-10 transition-all overflow-hidden"
      style={{
        top: top + "px", height: height + "px",
        left: `calc(${(col / totalCols) * 100}% + ${col === 0 ? 4 : GAP}px)`,
        width: `calc(${(1 / totalCols) * 100}% - ${col === 0 ? GAP + 4 : GAP * 2}px)`,
        backgroundColor: room.colorHex + "22",
        borderLeft: `3px solid ${room.colorHex}`,
        color: room.colorHex,
      }}
      onClick={() => onClick(booking)}>
      <div className="font-semibold truncate leading-tight">{booking.title}</div>
      {height > 28 && booking.activity && <div className="text-xs opacity-80 truncate">{booking.activity}</div>}
      {height > 42 && <div className="text-xs opacity-70 truncate">{booking.start_time}–{booking.end_time}{booking.visit_type ? ` · ${booking.visit_type === "Online" ? "🌐" : "📍"}` : ""}</div>}
      {height > 58 && <div className="text-xs opacity-60 truncate">👤 {room.name}</div>}
    </div>
  );
}

          const dateStr = localDateStr(day);
          const isToday = dateStr === todayStr();
          const laid = computeColumns(
            bookings.filter(b => b.date === dateStr && visibleIds.includes(b.room_id))

          return (
            <div key={di} className={`flex-1 border-l border-slate-100 relative ${isToday ? "bg-blue-50/30" : ""}`}

              <div className="absolute inset-0 pointer-events-none" style={{ zIndex: 5 }}>
                {laid.map(b => {

                      <BookingChip booking={b} room={room} col={b.col} totalCols={b.totalCols} onClick={onChipClick}/>

function DetailModal({ booking, onClose }) {
  if (!booking) return null;
  const room = ROOMS.find(r => r.id === booking.room_id);
  if (!room) return null;

  const rows = [
    { icon: "🏢", label: "Agent",      val: `${room.name} — 📍 ${room.city}` },
    booking.visit_type && { icon: booking.visit_type === "Online" ? "🌐" : "📍", label: "Type Visit", val: booking.visit_type },
    booking.activity   && { icon: "⚡", label: "Activity",  val: booking.activity },
    { icon: "📅", label: "Tanggal",    val: new Date(booking.date + "T00:00").toLocaleDateString("id-ID", { weekday:"long", day:"numeric", month:"long", year:"numeric" }) },
    { icon: "🕐", label: "Waktu",      val: `${booking.start_time} – ${booking.end_time}` },
    booking.attendees      && { icon: "👥", label: "Peserta",        val: booking.attendees },
    booking.booked_by_name && { icon: "👤", label: "Dibooking oleh", val: booking.booked_by_name },
    booking.notes          && { icon: "📝", label: "Catatan",        val: booking.notes },
  ].filter(Boolean);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30" onClick={onClose}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden fade-in" onClick={e => e.stopPropagation()}>
        <div className="h-2" style={{ backgroundColor: room.colorHex }}/>
        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800 pr-4">{booking.title}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none flex-shrink-0">&times;</button>
        </div>
        <div className="p-6 space-y-3 text-sm">
          {rows.map(r => (
            <div key={r.label} className="flex items-start gap-3">
              <span className="w-8 text-center text-base flex-shrink-0">{r.icon}</span>
              <div>
                <div className="font-medium text-slate-700">{r.val}</div>
                <div className="text-xs text-slate-400">{r.label}</div>
              </div>
            </div>
          ))}
        </div>
        <div className="px-6 pb-5">
          <button onClick={onClose}
            className="w-full py-2.5 rounded-xl border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50 transition-colors">
            Tutup
          </button>
        </div>
      </div>
    </div>
  );
}

function LoginGate({ onLogin }) {
  const [screen,   setScreen]   = useState("login");   // login | register | register_otp
  const [name,     setName]     = useState("");
  const [email,    setEmail]    = useState("");
  const [password, setPassword] = useState("");
  const [confirm,  setConfirm]  = useState("");
  const [otp,      setOtp]      = useState("");
  const [loading,  setLoading]  = useState(false);
  const [error,    setError]    = useState("");
  const [success,  setSuccess]  = useState("");
  const [resendCD, setResendCD] = useState(0);

  useEffect(() => {
    if (resendCD <= 0) return;
    const t = setTimeout(() => setResendCD(c => c - 1), 1000);
    return () => clearTimeout(t);
  }, [resendCD]);

  const go = s => { setScreen(s); setError(""); setSuccess(""); setOtp(""); };

  // ── LOGIN ──
  const handleLogin = async e => {
    e.preventDefault();
    setError("");
    const em = email.trim().toLowerCase();
    setLoading(true);
    try {
      const users = await supa.get("users", { email: `eq.${em}`, select: "*" });
      const user  = users.find(u => u.password_hash === password || u.password_hash === btoa(password));
      if (!user) { setError("Email atau password salah."); setLoading(false); return; }
      // Aturan akses login: email @majoo.id selalu boleh.
      // Pengecualian: akun dengan role "cs" tetap boleh login meskipun bukan @majoo.id
      // (mis. agent CS yang memakai @majoo.com / @gmail.com).
      // Aturan signup/daftar tidak berubah — pendaftaran baru tetap wajib @majoo.id.
      if (!em.endsWith(VIEWER_DOMAIN) && user.role !== "cs") {
        setError(`Akses ditolak. Halaman ini hanya untuk email ${VIEWER_DOMAIN} atau akun CS Agent.`);
        setLoading(false);
        return;
      }
      const { password_hash, ...safe } = user;
      saveViewerSession(safe);
      onLogin(safe);
    } catch(err) { setError("Gagal login: " + err.message); }
    setLoading(false);
  };

  // ── DAFTAR step 1: kirim OTP ──
  const handleRegisterRequest = async e => {
    e.preventDefault();
    if (loading) return;
    setError("");
    const em = email.trim().toLowerCase();
    if (!em.endsWith(VIEWER_DOMAIN)) { setError(`Pendaftaran hanya untuk email ${VIEWER_DOMAIN}.`); return; }
    setLoading(true);
    try {
      if (!name.trim())            { setError("Nama wajib diisi.");                       setLoading(false); return; }
      if (password.length < 6)     { setError("Password minimal 6 karakter.");            setLoading(false); return; }
      if (password !== confirm)    { setError("Konfirmasi password tidak cocok.");        setLoading(false); return; }
      const existing = await supa.get("users", { email: `eq.${em}` });
      if (existing.length > 0)     { setError("Email sudah terdaftar. Silakan login.");   setLoading(false); return; }
      const code = generateOTP();
      storeOTP(em, code);
      await sendOTPEmail(name, em, code);
      setResendCD(60);
      go("register_otp");
      setSuccess(`Kode OTP dikirim ke ${em}. Berlaku 5 menit.`);
    } catch(err) { setError("Gagal mengirim OTP: " + (err?.message || err?.text || JSON.stringify(err))); }
    setLoading(false);
  };

  // ── DAFTAR step 2: verifikasi OTP & buat akun ──
  const handleVerifyRegister = async e => {
    e.preventDefault();
    setError(""); setLoading(true);
    try {
      const em = email.trim().toLowerCase();
      const result = verifyOTP(em, otp.trim());
      if (result === "expired") { setError("Kode OTP sudah kadaluarsa. Kirim ulang."); setLoading(false); return; }
      if (result !== "ok")      { setError("Kode OTP salah. Periksa kembali.");        setLoading(false); return; }
      // Pendaftaran dari view.html: non-admin & non-CS otomatis role "viewer"
      // (view-only — tidak bisa login ke aplikasi utama / booking).
      const role = ADMIN_EMAILS.includes(em) ? "admin"
                : CS_EMAILS.includes(em)     ? "cs"
                : "viewer";
      await supa.insert("users", { id: "u-"+Date.now(), name, email: em, role, password_hash: password });
      setSuccess("Akun berhasil dibuat! Silakan masuk.");
      setPassword(""); setConfirm(""); setName(""); setOtp("");
      setTimeout(() => go("login"), 1500);
    } catch(err) { setError("Gagal membuat akun: " + err.message); }
    setLoading(false);
  };

  // ── KIRIM ULANG OTP ──
  const handleResend = async () => {
    if (resendCD > 0) return;
    setError(""); setLoading(true);
    try {
      const em = email.trim().toLowerCase();
      const code = generateOTP();
      storeOTP(em, code);
      await sendOTPEmail(name || em, em, code);
      setResendCD(60);
      setSuccess("Kode OTP baru sudah dikirim.");
    } catch(err) { setError("Gagal mengirim ulang: " + (err?.message || err?.text || JSON.stringify(err))); }
    setLoading(false);
  };

  return (
    <div className="min-h-screen flex items-center justify-center bg-slate-50 p-5">
      <div className="w-full max-w-sm bg-white rounded-2xl shadow-xl border border-slate-200 p-7">
        <div className="flex items-center justify-center mb-4">
          <MajooLogo width={100} height={30}/>
        </div>
        <h1 className="text-lg font-bold text-slate-800 text-center mb-1">CS Workload Calendar</h1>
        <p className="text-xs text-slate-500 text-center mb-6">Halaman terbatas — khusus email <span className="font-semibold">@majoo.id</span></p>

        {(screen === "login" || screen === "register") && (
          <div className="flex gap-1 bg-slate-100 rounded-xl p-1 mb-6">
            <button onClick={()=>go("login")}
              className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${screen==="login"?"bg-blue-600 text-white shadow-sm":"text-slate-500 hover:text-slate-700"}`}>Masuk</button>
            <button onClick={()=>go("register")}
              className={`flex-1 py-2 text-sm font-semibold rounded-lg transition-all ${screen==="register"?"bg-blue-600 text-white shadow-sm":"text-slate-500 hover:text-slate-700"}`}>Daftar</button>
          </div>
        )}

        {screen === "login" && (
          <form onSubmit={handleLogin} className="space-y-4 fade-in">
            <div>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Email</label>
              <input type="email" required autoFocus value={email} onChange={e=>setEmail(e.target.value)}
                placeholder="nama@majoo.id"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Password</label>
              <input type="password" required value={password} onChange={e=>setPassword(e.target.value)}
                placeholder="••••••••"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            {error   && <div className="bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-xs text-red-700">{error}</div>}
            {success && <div className="bg-emerald-50 border border-emerald-200 rounded-lg px-3 py-2 text-xs text-emerald-700">{success}</div>}
            <button type="submit" disabled={loading}

              {loading ? "Memverifikasi..." : "Masuk"}
            </button>
          </form>
        )}

        {screen === "register" && (
          <form onSubmit={handleRegisterRequest} className="space-y-4 fade-in">
            <div>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Nama Lengkap</label>
              <input type="text" required autoFocus value={name} onChange={e=>setName(e.target.value)}
                placeholder="Nama Anda"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Email</label>
              <input type="email" required value={email} onChange={e=>setEmail(e.target.value)}
                placeholder="nama@majoo.id"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Password</label>
              <input type="password" required value={password} onChange={e=>setPassword(e.target.value)}
                placeholder="Min. 6 karakter"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Konfirmasi Password</label>
              <input type="password" required value={confirm} onChange={e=>setConfirm(e.target.value)}
                placeholder="Ulangi password"
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
            </div>
            {error && <div className="bg-red-50 border border-red-200 rounded-lg px-3 py-2 text-xs text-red-700">{error}</div>}
            <button type="submit" disabled={loading}
              className="w-full py-2.5 rounded-xl bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold shadow-sm disabled:opacity-60 transition-colors">
              {loading ? "Mengirim OTP..." : "Daftar — Kirim OTP"}

        {screen === "register_otp" && (
          <form onSubmit={handleVerifyRegister} className="space-y-5 fade-in">
            <div className="text-center">
              <div className="text-4xl mb-3">📨</div>

          </button>
          <button onClick={goToday} className="px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-semibold text-slate-600 transition-colors">Hari Ini</button>
          <button onClick={nextWeek} className="p-1.5 rounded-lg hover:bg-slate-100 text-slate-500 transition-colors">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <span className="text-sm font-semibold text-slate-700 min-w-[120px] text-center">{monthLabel}</span>
        <button onClick={load} disabled={loading}
          className="flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-100 hover:bg-slate-200 text-xs font-medium text-slate-600 transition-colors disabled:opacity-50">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5"
            className={loading ? "animate-spin" : ""}>
            <polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>
          </svg>
          Refresh
        </button>

        {/* Akun viewer + keluar */}
        <div className="flex items-stretch h-8 bg-slate-50 border border-slate-200 rounded-lg overflow-hidden">
          <div className="flex items-center gap-2 px-2.5" title={viewer?.email}>
            <div aria-hidden="true" className="w-6 h-6 rounded-full bg-blue-600 text-white text-[10px] font-bold flex items-center justify-center">
              {(viewer?.name||"?").split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2)}
            </div>
            <span className="hidden sm:block text-xs font-semibold text-slate-700 max-w-[120px] truncate">{viewer?.name||viewer?.email}</span>
          </div>
          <div aria-hidden="true" className="w-px bg-slate-200"/>
          <button onClick={onLogout} aria-label="Keluar"
            className="px-3 text-xs font-medium text-red-500 hover:bg-red-50 hover:text-red-600 transition-colors">
            Keluar
          </button>
        </div>
      </header>

      {/* ── Area Tabs ── */}
      <div className="bg-white border-b border-slate-200 px-4 flex items-center gap-1 flex-shrink-0">
        {tabConfig.map(tab => (
          <button key={tab.label} onClick={() => changeArea(tab.label)}
            className={`px-4 py-3 text-sm font-semibold border-b-2 transition-all ${activeArea === tab.label
              ? "border-current text-current"
              : "border-transparent text-slate-400 hover:text-slate-600"}`}
            style={activeArea === tab.label ? { color: tab.color, borderColor: tab.color } : {}}>
            {tab.label}
            {tab.label !== "Semua" && (
              <span className="ml-1.5 text-xs font-normal opacity-70">
                ({ROOMS.filter(r => r.area === tab.label).length})
              </span>
            )}
          </button>
        ))}
        <div className="flex-1"/>
        {/* Week summary */}
        {!loading && (
          <div className="text-xs text-slate-400 py-2">
            <span className="font-semibold text-slate-600">{weekBookings.length}</span> aktivitas minggu ini
          </div>
        )}
      </div>

      {/* ── Agent Filter ── */}
      <AgentFilter
        rooms={areaRooms}
        selectedIds={selectedAgentIds}
        onToggle={toggleAgent}
        onSelectAll={selectAll}
        onClearAll={clearAll}
      />

      {/* ── Calendar ── */}
      <div className="flex-1 overflow-hidden flex flex-col">
        {loading ? (
          <div className="flex-1 flex items-center justify-center">
            <div className="text-center">
              <div className="w-8 h-8 border-2 border-teal-500 border-t-transparent rounded-full animate-spin mx-auto mb-3"/>
              <div className="text-sm text-slate-400">Memuat data...</div>
            </div>
          </div>
        ) : visibleRooms.length === 0 ? (
          <div className="flex-1 flex items-center justify-center">
            <div className="text-center">
              <div className="text-4xl mb-3">👆</div>
              <div className="text-sm font-semibold text-slate-600 mb-1">Belum ada agent dipilih</div>
              <div className="text-xs text-slate-400">Pilih minimal satu agent di atas untuk melihat jadwal</div>
            </div>
          </div>
        ) : (
          <CalendarGrid
            weekDays={weekDays}
            bookings={bookings}
            visibleRooms={visibleRooms}
            holidays={holidays}
            onChipClick={setDetailBooking}
          />
        )}
      </div>

      {/* ── Footer ── */}
      <div className="bg-white border-t border-slate-100 px-4 py-2 flex items-center justify-between text-xs text-slate-400 flex-shrink-0">
        <span>📅 Customer Support Majoo — View Only</span>
        <span>Terakhir diperbarui: {lastRefresh.toLocaleTimeString("id-ID", { hour:"2-digit", minute:"2-digit" })}</span>
      </div>

      {/* ── Detail Modal ── */}
      {detailBooking && (
        <DetailModal booking={detailBooking} onClose={() => setDetailBooking(null)}/>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [currentPage,   setCurrentPage]   = useState("calendar");
  const [currentUser,   setCurrentUser]   = useState(()=>loadSession());
  const [bookings,      setBookings]      = useState([]);
  const [holidays,      setHolidays]      = useState([]);
  const [selectedRooms, setSelectedRooms] = useState(() => {
    const u = loadSession();
    if (u?.role === "cs") {
      const rid = CS_AGENT_MAP[u.email];
      return rid ? [rid] : [];
    }
    return ROOMS.map(r => r.id);
  });
  const [exportOpen,    setExportOpen]    = useState(false);
  const [holidayOpen,   setHolidayOpen]   = useState(false);
  const [googleToken,   setGoogleToken]   = useState(null);
  const [gcalExpiry,    setGcalExpiry]    = useState(0);
  const [gcalConnecting,setGcalConnecting]= useState(false);
  const tokenClientRef  = React.useRef(null);
  const currentUserRef  = React.useRef(null);  // selalu up-to-date untuk callback async
  const gcalManualRef   = React.useRef(false);  // true = connect manual (tampilkan toast)
  const [baseDate,      setBaseDate]      = useState(new Date());
  const [modalOpen,     setModalOpen]     = useState(false);
  const [modalInit,     setModalInit]     = useState(null);
  const [detailBooking, setDetailBooking] = useState(null);
  const [notifOpen,     setNotifOpen]     = useState(false);
  const [approvalOpen,  setApprovalOpen]  = useState(false);
  const [notifLogs,     setNotifLogs]     = useState(() => { const s = loadSession(); return s ? loadNotifLogs(s.id) : []; });
  const [loading,       setLoading]       = useState(false);
  const [accountOpen,   setAccountOpen]   = useState(false);
  const [utilOpen,      setUtilOpen]      = useState(false);  // dropdown menu Utilities
  const [searchQuery,   setSearchQuery]   = useState("");     // pencarian booking di kalender
  const [searchListView,setSearchListView]= useState(false);  // true = tampilkan hasil sebagai list (saat Enter)
  const { toasts, add: addToast } = useToast();

  const weekDays = useMemo(()=>getWeekDays(baseDate),[baseDate]);

  // Load bookings dari Supabase — dibatasi rentang -12 sampai +12 bulan dari hari ini.
  // Mengurangi egress secara drastis dibanding tarik seluruh tabel tiap polling
  // (penting untuk plan Supabase Free yang punya batas 5 GB egress/bulan).
  const loadBookings = useCallback(async () => {
    setLoading(true);
    try {
      const now = new Date();
      const fromDt = new Date(now.getFullYear(), now.getMonth() - 12, 1);
      const toDt   = new Date(now.getFullYear(), now.getMonth() + 13, 0); // akhir bulan +12
      const fromStr = localDateStr(fromDt);
      const toStr   = localDateStr(toDt);
      // Filter date pakai dua parameter terpisah (PostgREST treat sbg implicit AND).
      // Pagination wajib: PostgREST default cap 1000 baris/request. Tanpa pagination,
      // booking di tanggal terjauh akan terpotong (penyebab "chip hilang" yang kita kejar).
      const url = `${SUPA_URL}/rest/v1/bookings?select=*&order=date.asc,start_time.asc&date=gte.${fromStr}&date=lte.${toStr}`;
      const PAGE = 1000;
      let allRows = [];
      let from = 0;
      for (let page = 0; page < 30; page++) {  // safety cap 30 pages = 30k rows
        const r = await fetch(url, {
          headers: { ...supa.headers, Range: `${from}-${from + PAGE - 1}`, "Range-Unit": "items" }
        });
        if (!r.ok) throw new Error(await r.text());
        const chunk = await r.json();
        allRows = allRows.concat(chunk);
        if (chunk.length < PAGE) break;
        from += PAGE;
      }
      console.log(`[loadBookings] ${allRows.length} rows (range ${fromStr}→${toStr}, ${Math.ceil(allRows.length/PAGE)} req)`);
      setBookings(allRows);
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal memuat data", message:e.message, color:"#ef4444" });
    }
    setLoading(false);
  }, []);

  const loadHolidays = useCallback(async () => {
    try {
      const data = await supa.get("holidays", { select: "*", order: "date.asc" });
      setHolidays(data);
    } catch(e) { console.warn("Gagal load holidays:", e.message); }
  }, []);

  // Auto-load saat login
  useEffect(()=>{ if (currentUser) { loadBookings(); loadHolidays(); } },[currentUser]);

  // Sync currentUserRef agar selalu fresh di dalam callback async
  useEffect(() => { currentUserRef.current = currentUser; }, [currentUser]);

  // Init Google Identity Services (sekali saja)
  useEffect(() => {
    if (GCAL_CLIENT_ID === "YOUR_GOOGLE_CLIENT_ID_HERE") return;
    const tryInit = () => {
      if (window.google?.accounts?.oauth2) {
        tokenClientRef.current = window.google.accounts.oauth2.initTokenClient({
          client_id: GCAL_CLIENT_ID,
          scope: GCAL_SCOPE,
          callback: (resp) => {
            const isManual = gcalManualRef.current;
            gcalManualRef.current = false;
            setGcalConnecting(false);
            if (resp.access_token) {
              setGoogleToken(resp.access_token);
              setGcalExpiry(Date.now() + (resp.expires_in - 60) * 1000);
              const u = currentUserRef.current;
              if (u) localStorage.setItem(`gcal_${u.id}`, "1");
              if (isManual) {
                addToast({ icon:"📅", title:"Google Calendar terhubung", message:"Booking akan otomatis masuk ke Google Calendar kamu.", color:"#10b981" });
              }
            } else {
              // Gagal (manual) — tampilkan error; gagal (silent) — clear flag saja
              const u = currentUserRef.current;
              if (u) localStorage.removeItem(`gcal_${u.id}`);
              if (isManual && resp.error) {
                addToast({ icon:"❌", title:"Gagal connect Google", message:resp.error||"Unknown error", color:"#ef4444" });
              }
            }
          }
        });
      } else { setTimeout(tryInit, 500); }
    };
    tryInit();
  }, []);

  // Auto-reconnect saat login jika sebelumnya sudah pernah connect
  useEffect(() => {
    if (!currentUser) return;
    if (!localStorage.getItem(`gcal_${currentUser.id}`)) return;
    // Delay kecil agar GIS selesai load
    const t = setTimeout(() => {
      if (tokenClientRef.current) {
        tokenClientRef.current.requestAccessToken({ prompt: "" }); // silent, no popup
      }
    }, 1200);
    return () => clearTimeout(t);
  }, [currentUser]);

  // Refresh token otomatis setiap 50 menit agar tidak expired saat sedang aktif
  useEffect(() => {
    const iv = setInterval(() => {
      if (!currentUser || !tokenClientRef.current) return;
      if (!localStorage.getItem(`gcal_${currentUser.id}`)) return;
      tokenClientRef.current.requestAccessToken({ prompt: "" });
    }, 50 * 60 * 1000);
    return () => clearInterval(iv);
  }, [currentUser]);

  // Realtime — polling jadi 3 menit untuk hemat egress Supabase.
  // User tetap bisa pakai tombol Refresh di header untuk paksa muat ulang segera.
  useEffect(()=>{
    if (!currentUser) return;
    const interval = setInterval(loadBookings, 180000);
    return () => clearInterval(interval);
  },[currentUser]);

  const getGoogleToken = () => (googleToken && Date.now() < gcalExpiry) ? googleToken : null;
  const connectGoogleCal = () => {
    if (!tokenClientRef.current) {
      addToast({ icon:"⚠️", title:"Google belum siap", message:"Tunggu sebentar dan coba lagi.", color:"#f59e0b" });
      return;
    }
    gcalManualRef.current = true;
    setGcalConnecting(true);
    tokenClientRef.current.requestAccessToken({ prompt: "consent" }); // paksa popup untuk manual connect
  };

  const login = user => {
    saveSession(user);
    setCurrentUser(user);
    setNotifLogs(loadNotifLogs(user.id));
    if (user.role === "cs") {
      const rid = CS_AGENT_MAP[user.email];
      setSelectedRooms(rid ? [rid] : []);
    } else {
      setSelectedRooms(ROOMS.map(r => r.id));
    }
  };
  const logout = () => { saveSession(null); setCurrentUser(null); setBookings([]); setNotifLogs([]); };
  const updateUser = user => { saveSession(user); setCurrentUser(user); };

  const notify = (type, booking) => {
    const room  = ROOMS.find(r=>r.id===booking.room_id);
    const icons = {create:"✅",update:"✏️",delete:"🗑️"};
    const titles= {create:"Booking Berhasil",update:"Booking Diperbarui",delete:"Booking Dihapus"};
    const entry = {id:Date.now(),ts:Date.now(),icon:icons[type],title:titles[type],
      message:`"${booking.title}" — ${room?.name} · ${booking.date} · ${booking.start_time}–${booking.end_time}`,
      read: false};
    setNotifLogs(p => {
      const updated = [...p, entry];
      if (currentUser) saveNotifLogs(currentUser.id, updated);
      return updated;
    });
    addToast({icon:icons[type],title:titles[type],message:`${booking.title} di ${room?.name}`,color:room?.colorHex});
  };

  const markAllRead = () => {
    const updated = notifLogs.map(l => ({...l, read: true}));
    setNotifLogs(updated);
    if (currentUser) saveNotifLogs(currentUser.id, updated);
  };

  const clearAllNotifs = () => {
    setNotifLogs([]);
    if (currentUser) saveNotifLogs(currentUser.id, []);
  };

  // Untuk CS role: room yang terkunci ke agent mereka
  const csRoomId = currentUser?.role === "cs" ? CS_AGENT_MAP[currentUser.email] : null;

  const toggleRoom   = id => {
    if (currentUser?.role === "cs") return;
    setSelectedRooms(p => p.includes(id) ? p.filter(r => r !== id) : [...p, id]);
  };
  const selectAllRooms = () => setSelectedRooms(ROOMS.map(r => r.id));
  const clearAllRooms  = () => setSelectedRooms([]);

  const prevWeek = ()=>{ const d=new Date(baseDate); d.setDate(d.getDate()-7); setBaseDate(d); };
  const nextWeek = ()=>{ const d=new Date(baseDate); d.setDate(d.getDate()+7); setBaseDate(d); };

  const openNew = (date, startTime) => {
    const defaultRoom = csRoomId || selectedRooms[0] || ROOMS[0].id;
    setModalInit({room_id: defaultRoom, title:"", date:date||todayStr(),
      start_time:startTime||"09:00", end_time:startTime?addHour(startTime):"10:00",
      attendees:"", notes:"", visit_type:"Online", activity:""});
    setModalOpen(true);
  };
  const openEdit = b => { setDetailBooking(null); setModalInit({...b}); setModalOpen(true); };

  const handleSave = async data => {
    try {
      const gToken  = getGoogleToken();
      const room    = ROOMS.find(r => r.id === data.room_id);
      const rName   = room?.name || "";

      if (data.id) {
        // ── UPDATE ──────────────────────────────────────────────
        // Cek overlap waktu dengan booking lain (kecuali diri sendiri)
        const hasOverlapUpdate = !!findConflict(bookings, data);
        const needsApprovalUpdate = hasOverlapUpdate && currentUser?.role !== "admin";
        // Pertahankan creator asli saat admin mengedit — agar CS tetap bisa edit bookingnya sendiri
        const originalBooking = bookings.find(b => b.id === data.id);
        const keepCreator = currentUser?.role === "admin" && originalBooking?.booked_by_email;
        const updated = await supa.update("bookings", data.id, {
          room_id: data.room_id, sch_code: data.sch_code || "", title: data.title, date: data.date,
          start_time: data.start_time, end_time: data.end_time,
          attendees: data.attendees, notes: data.notes,
          booked_by_name: keepCreator ? originalBooking.booked_by_name : data.booked_by_name,
          booked_by_email: keepCreator ? originalBooking.booked_by_email : data.booked_by_email,
          visit_type: data.visit_type || "Online", activity: data.activity || "",
          status_jadwal: data.status_jadwal || "",
          status_assignment: data.status_assignment || "Need Assign CRM",
          ...(needsApprovalUpdate ? { approval_status: "pending" } : {}),
        });
        setBookings(p=>p.map(b=>b.id===data.id?(updated[0]||data):b));
        notify("update", data);
        if (needsApprovalUpdate) {
          addToast({ icon:"⏳", title:"Menunggu Persetujuan", message:"Re-schedule waktunya bertabrakan dengan jadwal lain, perlu disetujui admin sebelum dikonfirmasi.", color:"#f59e0b" });
        }
        // Update event di Google Calendar jika ada & bukan Training Offline & tidak pending approval
        if (gToken && data.google_event_id && !isOfflineVisit(data) && !needsApprovalUpdate) {
          try { await gcalUpdateEvent(gToken, data.google_event_id, data, rName); }
          catch (e) { addToast({ icon:"⚠️", title:"Google Calendar", message:"Booking disimpan, tapi gagal update di Google Calendar.", color:"#f59e0b" }); }
        }
      } else {
        // ── CREATE ──────────────────────────────────────────────
        const newId = "bk-"+Date.now();
        // Cek apakah tanggal ini libur untuk agent tsb
        const onHoliday = isHoliday(holidays, data.room_id, data.date);
        // Cek overlap waktu dengan booking lain yang sudah approved
        const hasOverlap = !!findConflict(bookings, data);
        const needApproval = (onHoliday || hasOverlap) && currentUser?.role !== "admin";
        const approvalStatus = needApproval ? "pending" : null;

        let gcalFields = { google_event_id: "", meet_link: "" };
        // Buat GCal event hanya jika tidak perlu approval & bukan Training Offline
        if (gToken && !needApproval && !isOfflineVisit(data)) {
          try {
            gcalFields = await gcalCreateEvent(gToken, { ...data, id: newId }, rName);
          } catch (e) {
            addToast({ icon:"⚠️", title:"Google Calendar", message:"Booking disimpan, tapi gagal buat event di Google Calendar.", color:"#f59e0b" });
          }
        }
        const inserted = await supa.insert("bookings", {
          id: newId, room_id: data.room_id, sch_code: data.sch_code || "", title: data.title, date: data.date,
          start_time: data.start_time, end_time: data.end_time,
          attendees: data.attendees||"", notes: data.notes||"",
          booked_by_name: data.booked_by_name, booked_by_email: data.booked_by_email,
          visit_type: data.visit_type || "Online", activity: data.activity || "",
          status_jadwal: data.status_jadwal || "",
          status_assignment: "Need Assign CRM",
          approval_status: approvalStatus,
          ...gcalFields,
        });
        const newBooking = inserted[0] || { ...data, id: newId, approval_status: approvalStatus, ...gcalFields };
        setBookings(p=>[...p, newBooking]);
        notify("create", data);
        if (needApproval) {
          const reason = onHoliday && hasOverlap
            ? "di hari libur dan waktu bertabrakan dengan jadwal lain"
            : onHoliday
            ? "di hari libur"
            : "waktunya bertabrakan dengan jadwal lain";
          addToast({ icon:"⏳", title:"Menunggu Persetujuan", message:`Booking ${reason}, perlu disetujui admin sebelum dikonfirmasi.`, color:"#f59e0b" });
        } else if (gcalFields.meet_link) {
          addToast({ icon:"🎥", title:"Google Meet siap!", message:"Link meeting tersedia di detail booking.", color:"#10b981" });
        }
        // Email notifikasi booking dinonaktifkan
      }
      setModalOpen(false);
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal menyimpan", message:e.message, color:"#ef4444" });
    }
  };

  const handleDelete = async id => {
    try {
      const b = bookings.find(b=>b.id===id);
      await supa.delete("bookings", id);
      setBookings(p=>p.filter(b=>b.id!==id));
      setModalOpen(false);
      setDetailBooking(null);
      if (b) notify("delete", b);
      // Hapus juga dari Google Calendar jika ada
      const gToken = getGoogleToken();
      if (gToken && b?.google_event_id) {
        try { await gcalDeleteEvent(gToken, b.google_event_id); } catch {}
      }
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal menghapus", message:e.message, color:"#ef4444" });
    }
  };

  // Approve atau Reject booking di hari libur
  const handleApproval = async (id, action) => {
    // action: "approved" | "rejected"
    try {
      const b = bookings.find(b => b.id === id);
      const fields = { approval_status: action };
      const r = await fetch(`${SUPA_URL}/rest/v1/bookings?id=eq.${id}`, {
        method: "PATCH",
        headers: { ...supa.headers, "Prefer": "return=representation" },
        body: JSON.stringify(fields),
      });
      if (!r.ok) throw new Error(await r.text());
      setBookings(p => p.map(bk => bk.id === id ? { ...bk, ...fields } : bk));
      setDetailBooking(p => p ? { ...p, ...fields } : p);

      if (action === "approved") {
        addToast({ icon:"✅", title:"Booking Disetujui", message:`${b?.title || "Booking"} telah dikonfirmasi.`, color:"#10b981" });
        // Buat GCal event setelah approved (kecuali Training Offline)
        const gToken = getGoogleToken();
        const room = ROOMS.find(r => r.id === b?.room_id);
        if (gToken && b && !b.google_event_id && !isOfflineVisit(b)) {
          try {
            const { google_event_id, meet_link } = await gcalCreateEvent(gToken, b, room?.name || "");
            await fetch(`${SUPA_URL}/rest/v1/bookings?id=eq.${id}`, {
              method: "PATCH",
              headers: { ...supa.headers },
              body: JSON.stringify({ google_event_id, meet_link }),
            });
            setBookings(p => p.map(bk => bk.id === id ? { ...bk, google_event_id, meet_link } : bk));
            setDetailBooking(p => p ? { ...p, google_event_id, meet_link } : p);
          } catch {}
        }
      } else {
        addToast({ icon:"❌", title:"Booking Ditolak", message:`${b?.title || "Booking"} telah ditolak.`, color:"#ef4444" });
      }
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal update approval", message:e.message, color:"#ef4444" });
    }
  };

  // Update status field saja (status_jadwal atau status_assignment)
  const handleUpdateStatus = async (id, fields) => {
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/bookings?id=eq.${id}`, {
        method: "PATCH",
        headers: { ...supa.headers, "Prefer": "return=representation" },
        body: JSON.stringify(fields),
      });
      if (!r.ok) throw new Error(await r.text());
      const updated = await r.json();
      setBookings(p => p.map(b => b.id === id ? { ...b, ...fields } : b));
      setDetailBooking(p => p ? { ...p, ...fields } : p);
      addToast({ icon:"✅", title:"Status diperbarui", message: Object.values(fields)[0], color:"#10b981" });
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal update status", message:e.message, color:"#ef4444" });
    }
  };

  if (!currentUser) return <LoginScreen onLogin={login}/>;

  const todayCount = bookings.filter(b=>b.date===todayStr()).length;

  return (
    <div className="flex flex-col h-screen overflow-hidden">
      <header className="bg-white border-b border-slate-200 px-5 py-2.5 flex items-center gap-3 flex-shrink-0 shadow-sm">
        <div className="flex items-center gap-2.5">
          <svg width="80" height="24" viewBox="0 0 600 180" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path fillRule="evenodd" clipRule="evenodd" d="M401.541 5C418.312 5 433.686 11.9059 444.652 23.0202C455.725 34.1344 462.605 49.4569 462.605 66.2901C462.605 83.1234 455.725 98.5538 444.652 109.56C433.578 120.674 418.312 127.58 401.541 127.58C384.77 127.58 369.396 120.674 358.43 109.56C347.357 98.4459 340.477 83.1234 340.477 66.2901C340.477 49.4569 347.357 34.0265 358.43 23.0202C369.504 11.9059 384.77 5 401.541 5ZM401.541 37.3716C393.585 37.3716 386.382 40.6087 381.222 45.8961C375.954 51.1834 372.729 58.4131 372.729 66.2901C372.729 74.2751 375.954 81.5048 381.222 86.6842C386.49 91.9716 393.693 95.2088 401.541 95.2088C409.497 95.2088 416.7 91.9716 421.86 86.6842C427.128 81.3969 430.353 74.1672 430.353 66.2901C430.353 58.3052 427.128 51.0755 421.86 45.8961C416.7 40.6087 409.497 37.3716 401.541 37.3716Z" fill="url(#hlg0)"/>

            <defs>
              <linearGradient id="hlg0" x1="401.584" y1="123.238" x2="401.584" y2="0.59207" gradientUnits="userSpaceOnUse"><stop stopColor="#2DBDB6"/><stop offset="0.27" stopColor="#2DBDB6"/><stop offset="1" stopColor="#9ACF87"/></linearGradient>
              <linearGradient id="hlg1" x1="217.014" y1="115.229" x2="217.014" y2="-7.41644" gradientUnits="userSpaceOnUse"><stop stopColor="#2DBDB6"/><stop offset="0.27" stopColor="#2DBDB6"/><stop offset="1" stopColor="#9ACF87"/></linearGradient>
              <linearGradient id="hlg2" x1="538.798" y1="119.678" x2="538.798" y2="-2.96815" gradientUnits="userSpaceOnUse"><stop stopColor="#2DBDB6"/><stop offset="0.27" stopColor="#2DBDB6"/><stop offset="1" stopColor="#9ACF87"/></linearGradient>
              <linearGradient id="hlg3" x1="288.653" y1="135.285" x2="288.653" y2="-4.24338" gradientUnits="userSpaceOnUse"><stop stopColor="#2DBDB6"/><stop offset="0.27" stopColor="#2DBDB6"/><stop offset="0.5009" stopColor="#57C1AA"/><stop offset="0.9669" stopColor="#96CE8A"/><stop offset="1" stopColor="#9ACF87"/></linearGradient>

          </svg>
          <div className="w-px h-5 bg-slate-200"/>
          <div className="text-xs font-medium text-slate-500 leading-tight">Customer Support Agent</div>
        </div>

        {/* Navigasi halaman */}
        <nav aria-label="Navigasi halaman" className="flex items-center gap-1 ml-2 bg-slate-100 rounded-lg p-1">
          {[["calendar","📅","Calendar"],["dashboard","📊","Dashboard"]].map(([pg,ic,lbl])=>(
            <button key={pg} onClick={()=>setCurrentPage(pg)}
              aria-current={currentPage===pg ? "page" : undefined}
              className={`flex items-center gap-1.5 h-8 px-3 rounded-md text-xs font-semibold transition-all ${
                currentPage===pg ? "bg-white text-teal-700 shadow-sm" : "text-slate-500 hover:text-slate-700"
              }`}>
              <span aria-hidden="true">{ic}</span><span className="hidden sm:inline">{lbl}</span>
            </button>
          ))}
        </nav>

        {currentPage === "calendar" && (
        <div role="group" aria-label="Navigasi minggu" className="flex items-center gap-1 ml-1">
          <button onClick={prevWeek} aria-label="Minggu sebelumnya"
            className="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 transition-colors">◀</button>
          <button onClick={()=>setBaseDate(new Date())}
            className="h-8 px-3 rounded-lg border border-slate-200 text-xs font-medium text-slate-600 hover:bg-slate-50 transition-colors">Hari Ini</button>
          <button onClick={nextWeek} aria-label="Minggu berikutnya"
            className="w-8 h-8 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 transition-colors">▶</button>
          <span className="text-sm font-semibold text-slate-700 ml-1.5 whitespace-nowrap">{fmtMonthYear(weekDays[0])}</span>
        </div>
        )}

        <div className="ml-auto flex items-center gap-2">
          {/* Muat ulang data */}
          <button onClick={loadBookings} disabled={loading} aria-label="Muat ulang data"
            className="hidden sm:flex items-center gap-1.5 h-9 px-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-600 hover:bg-slate-100 disabled:opacity-50 transition-colors">
            {loading ? (
              <svg className="w-3.5 h-3.5 animate-spin" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                <path d="M12 2v4M12 18v4M4.93 4.93l2.83 2.83M16.24 16.24l2.83 2.83M2 12h4M18 12h4M4.93 19.07l2.83-2.83M16.24 7.76l2.83-2.83"/>
              </svg>
            ) : (
              <svg className="w-3.5 h-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" aria-hidden="true">
                <path d="M1 4v6h6M23 20v-6h-6"/><path d="M20.49 9A9 9 0 0 0 5.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 0 1 3.51 15"/>
              </svg>
            )}
            <span>{loading ? "Memuat..." : "Refresh"}</span>
          </button>

          {/* Jumlah booking hari ini */}
          <div className="hidden md:flex items-center h-9 px-3 bg-slate-50 border border-slate-200 rounded-lg text-xs font-medium text-slate-600 whitespace-nowrap">
            {todayCount} booking hari ini
          </div>

          {/* Pending approval badge (admin only) */}
          {currentUser?.role === "admin" && (() => {
            const pendingCount = bookings.filter(b => b.approval_status === "pending").length;
            return (
              <button onClick={()=>setApprovalOpen(true)}
                title={pendingCount > 0 ? `${pendingCount} booking menunggu persetujuan` : "Tidak ada booking pending"}
                className={`relative w-9 h-9 flex items-center justify-center rounded-lg transition-colors ${pendingCount > 0 ? "text-amber-600 hover:bg-amber-50" : "text-slate-300 cursor-default"}`}>
                <span aria-hidden="true">⏳</span>
                {pendingCount > 0 && (
                  <span className="absolute top-0.5 right-0.5 bg-amber-500 text-white text-[10px] rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center font-bold leading-none">
                    {pendingCount > 9 ? "9+" : pendingCount}
                  </span>
                )}
              </button>
            );
          })()}

          {/* Notifikasi */}
          <button onClick={()=>setNotifOpen(true)}
            aria-label={countUnread(notifLogs)>0 ? `Notifikasi, ${countUnread(notifLogs)} belum dibaca` : "Notifikasi"}
            className="relative w-9 h-9 flex items-center justify-center rounded-lg text-slate-500 hover:bg-slate-100 transition-colors">
            <span aria-hidden="true">🔔</span>
            {countUnread(notifLogs)>0 && (
              <span className="absolute top-0.5 right-0.5 bg-red-500 text-white text-[10px] rounded-full min-w-[16px] h-4 px-1 flex items-center justify-center font-bold leading-none">
                {countUnread(notifLogs)>9?"9+":countUnread(notifLogs)}
              </span>
            )}
          </button>

          {/* Akun — tombol profil & keluar terpisah dalam satu pill */}
          <div className="flex items-stretch h-9 bg-slate-50 border border-slate-200 rounded-lg overflow-hidden">
            <button onClick={()=>setAccountOpen(true)} aria-label="Buka pengaturan akun"
              className="flex items-center gap-2 px-2.5 hover:bg-slate-100 transition-colors">
              {currentUser.photo
                ? <img src={currentUser.photo} alt="" className="w-6 h-6 rounded-full object-cover"/>
                : <div aria-hidden="true" className="w-6 h-6 rounded-full bg-blue-600 text-white text-xs font-bold flex items-center justify-center">
                    {currentUser.name?.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2)||"?"}
                  </div>
              }
              <span className="hidden sm:flex flex-col items-start leading-tight">
                <span className="text-xs font-semibold text-slate-700 max-w-[140px] truncate">{currentUser.name}</span>
                <span className="text-[10px] text-slate-400">{currentUser.role==="admin"?"Admin":currentUser.role==="cs"?"CS Agent":"Employee"}</span>
              </span>
            </button>
            <div aria-hidden="true" className="w-px bg-slate-200 hidden sm:block"/>
            <button onClick={logout} aria-label="Keluar dari akun"
              className="hidden sm:flex items-center px-3 text-xs font-medium text-red-500 hover:bg-red-50 hover:text-red-600 transition-colors">
              Keluar
            </button>
          </div>

          {/* Utilities — gabungan Connect GCal, Export, Libur dalam satu dropdown */}
          {(() => {
            const showGCal  = (currentUser?.role==="admin" || currentUser?.role==="cs") && GCAL_CLIENT_ID !== "YOUR_GOOGLE_CLIENT_ID_HERE";
            const showAdmin = currentUser?.role==="admin";
            if (!showGCal && !showAdmin) return null;
            return (
              <div className="relative">
                <button onClick={()=>setUtilOpen(o=>!o)} aria-haspopup="menu" aria-expanded={utilOpen} aria-label="Utilities"
                  className={`flex items-center gap-1.5 h-9 px-3 rounded-lg text-xs font-semibold border transition-colors ${
                    utilOpen ? "bg-slate-100 border-slate-300 text-slate-700" : "bg-slate-50 border-slate-200 text-slate-600 hover:bg-slate-100"
                  }`}>
                  <span aria-hidden="true">🧰</span>
                  <span className="hidden sm:inline">Utilities</span>
                  <span aria-hidden="true" className={`text-[10px] transition-transform ${utilOpen?"rotate-180":""}`}>▾</span>
                </button>
                {utilOpen && (<>
                  {/* backdrop transparan untuk menutup menu saat klik di luar */}
                  <div className="fixed inset-0 z-40" aria-hidden="true" onClick={()=>setUtilOpen(false)}/>
                  <div role="menu" aria-label="Utilities"
                    className="absolute right-0 mt-2 w-56 bg-white border border-slate-200 rounded-xl shadow-lg p-1.5 z-50 flex flex-col gap-1">
                    {showGCal && (
                      <button role="menuitem" onClick={()=>{connectGoogleCal(); setUtilOpen(false);}} disabled={gcalConnecting}
                        title={getGoogleToken() ? "Google Calendar terhubung — klik untuk reconnect" : "Hubungkan ke Google Calendar"}
                        className={`flex items-center gap-2 w-full h-9 px-3 rounded-lg text-xs font-semibold text-white shadow-sm transition-colors disabled:opacity-60 ${
                          getGoogleToken() ? "bg-green-500 hover:bg-green-600" : "bg-slate-500 hover:bg-slate-600"
                        }`}>
                        <span aria-hidden="true">{gcalConnecting ? "⏳" : getGoogleToken() ? "📅✓" : "📅"}</span>
                        <span>{gcalConnecting ? "Menghubungkan..." : getGoogleToken() ? "GCal Terhubung" : "Connect GCal"}</span>
                      </button>
                    )}
                    {showAdmin && (
                      <button role="menuitem" onClick={()=>{setExportOpen(true); setUtilOpen(false);}}
                        className="flex items-center gap-2 w-full h-9 px-3 rounded-lg text-xs font-semibold text-white bg-teal-500 hover:bg-teal-600 shadow-sm transition-colors">
                        <span aria-hidden="true">📊</span><span>Export</span>
                      </button>
                    )}
                    {showAdmin && (
                      <button role="menuitem" onClick={()=>{setHolidayOpen(true); setUtilOpen(false);}}
                        className="flex items-center gap-2 w-full h-9 px-3 rounded-lg text-xs font-semibold text-white bg-orange-500 hover:bg-orange-600 shadow-sm transition-colors">
                        <span aria-hidden="true">🏖️</span><span>Libur</span>
                      </button>
                    )}
                  </div>
                </>)}
              </div>
            );
          })()}

          {/* Aksi utama — tambah booking */}
          <button onClick={()=>openNew()} aria-label="Tambah booking baru"
            className="flex items-center gap-1.5 h-9 px-3.5 rounded-lg text-xs font-semibold text-white bg-blue-600 hover:bg-blue-700 shadow-sm transition-colors">
            <span className="text-base leading-none" aria-hidden="true">+</span>
            <span className="hidden sm:inline">Booking</span>
          </button>
        </div>
      </header>

      {currentPage === "dashboard"
        ? <DashboardPage bookings={bookings} currentUser={currentUser}/>
        : <div className="flex flex-1 overflow-hidden">
        {currentUser?.role === "cs" ? (
          /* ── CS Agent: sidebar mini menampilkan info agent mereka ── */
          (() => {
            const myRoom = ROOMS.find(r => r.id === csRoomId);
            if (!myRoom) return null;
            return (
              <aside className="w-52 flex-shrink-0 border-r border-slate-200 bg-white flex flex-col">
                <div className="px-4 py-3 border-b border-slate-100">
                  <div className="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-2">Agent Saya</div>
                  <div className="rounded-xl p-3 border-2" style={{borderColor:myRoom.colorHex,backgroundColor:myRoom.colorHex+"12"}}>
                    <div className="flex items-center gap-2 mb-1">
                      <span className="w-3 h-3 rounded-full flex-shrink-0" style={{backgroundColor:myRoom.colorHex}}/>
                      <span className="text-xs font-bold text-slate-800 leading-tight">{myRoom.name}</span>
                    </div>
                    <div className="text-xs text-slate-500 pl-5">📍 {myRoom.city}</div>
                    <div className="text-xs text-slate-400 pl-5 mt-0.5">🗺 {myRoom.area}</div>
                  </div>
                </div>
                <div className="px-4 py-3 text-xs text-slate-400 leading-relaxed">
                  <div className="font-semibold text-slate-500 mb-1">ℹ️ Info</div>
                  Tampilan kalender hanya menampilkan jadwal Anda. Booking baru otomatis tercatat untuk agent Anda.
                </div>
              </aside>
            );
          })()
        ) : (
          <RoomSidebar rooms={ROOMS} selectedRooms={selectedRooms} onToggle={toggleRoom} onSelectAll={selectAllRooms} onClearAll={clearAllRooms}
            baseDate={baseDate} onPickDate={setBaseDate}
            searchQuery={searchQuery}
            onSearchChange={v => { setSearchQuery(v); if (!v.trim()) setSearchListView(false); }}
            onSearchSubmit={() => { if (searchQuery.trim()) setSearchListView(true); }}/>
        )}
        <main className="flex-1 flex flex-col overflow-hidden bg-white">
          {loading && bookings.length===0 ? (
            <div className="flex-1 flex items-center justify-center">
              <div className="text-center text-slate-400">
                <div className="text-4xl mb-3">⏳</div>
                <div className="text-sm">Memuat data dari Supabase...</div>
              </div>
            </div>
          ) : (searchListView && searchQuery.trim()) ? (
            <SearchResultsView bookings={bookings} rooms={ROOMS} query={searchQuery}
              onRowClick={b=>setDetailBooking(b)} onBack={()=>setSearchListView(false)}/>
          ) : (selectedRooms.length === 0 && !searchQuery.trim()) ? (
            <div className="flex-1 flex items-center justify-center">
              <div className="text-center">
                <div className="text-4xl mb-3">👆</div>
                <div className="text-sm font-semibold text-slate-600 mb-1">Belum ada agent dipilih</div>
                <div className="text-xs text-slate-400">Pilih minimal satu agent di sidebar, atau gunakan kolom pencarian</div>
              </div>
            </div>
          ) : (
            <CalendarGrid weekDays={weekDays} bookings={bookings} rooms={ROOMS}
              selectedRooms={selectedRooms} currentUser={currentUser} searchQuery={searchQuery}
              onSlotClick={openNew} onChipClick={b=>setDetailBooking(b)} holidays={holidays}/>
          )}
        </main>
      </div>
      }

      <BookingModal isOpen={modalOpen} onClose={()=>setModalOpen(false)}
        onSave={handleSave} onDelete={handleDelete} rooms={ROOMS}
        initialData={modalInit} bookings={bookings} currentUser={currentUser} holidays={holidays}
        lockedRoomId={csRoomId}/>

      {detailBooking && (
        <DetailModal booking={detailBooking} room={ROOMS.find(r=>r.id===detailBooking.room_id)}
          onClose={()=>setDetailBooking(null)} onEdit={openEdit}
          onDelete={handleDelete} onUpdateStatus={handleUpdateStatus}
          onApproval={handleApproval} currentUser={currentUser}/>
      )}

      {notifOpen && <NotifPanel logs={notifLogs} onClose={()=>setNotifOpen(false)} onMarkAllRead={markAllRead} onClearAll={clearAllNotifs}/>}
      {approvalOpen && <ApprovalPanel bookings={bookings} onClose={()=>setApprovalOpen(false)} onSelect={b=>setDetailBooking(b)}/>}
      {exportOpen && <ExportModal onClose={()=>setExportOpen(false)} bookings={bookings}/>}
      {holidayOpen && <HolidayModal isOpen={holidayOpen} onClose={()=>setHolidayOpen(false)}
        holidays={holidays} onSave={loadHolidays} onDelete={loadHolidays} currentUser={currentUser}/>}
      {accountOpen && <AccountModal currentUser={currentUser} onClose={()=>setAccountOpen(false)} onUpdate={u=>{updateUser(u);setAccountOpen(false);addToast({icon:"✅",title:"Profil diperbarui",message:"Data akun berhasil disimpan.",color:"#10b981"});}}/>}
      <ToastContainer toasts={toasts}/>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>

const supa = {
  headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY, "Content-Type": "application/json", "Prefer": "return=representation" },

  async get(table, params) {
    const q = params ? "?" + new URLSearchParams(params) : "";
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}${q}`, { headers: this.headers });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },

  async insert(table, data) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}`, {
      method: "POST", headers: this.headers, body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },

  async update(table, id, data) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: "PATCH", headers: this.headers, body: JSON.stringify(data)
    });
    if (!r.ok) throw new Error(await r.text());
    return r.json();
  },

  async delete(table, id) {
    const r = await fetch(`${SUPA_URL}/rest/v1/${table}?id=eq.${id}`, {
      method: "DELETE", headers: this.headers
    });
    if (!r.ok) throw new Error(await r.text());
    return true;
  },

  // Realtime subscription via SSE
  subscribe(table, callback) {
    const url = `${SUPA_URL}/realtime/v1/sse?apikey=${SUPA_KEY}&channel=realtime:public:${table}`;
    const es = new EventSource(url);
    es.onmessage = e => { try { callback(JSON.parse(e.data)); } catch {} };
    return es;
  }
};

async function createResetToken(email) {
  // Hapus token lama untuk email ini
  const old = await supa.get("password_resets", { email: `eq.${email}`, used: "eq.false" });
  for (const r of old) {
    await fetch(`${SUPA_URL}/rest/v1/password_resets?token=eq.${r.token}`, {
      method: "DELETE",
      headers: { "apikey": SUPA_KEY, "Authorization": "Bearer " + SUPA_KEY }
    });
  }
  // Buat token baru
  const token = crypto.randomUUID ? crypto.randomUUID() : (Math.random().toString(36).slice(2) + Date.now().toString(36));
  const expiresAt = new Date(Date.now() + 30*60*1000).toISOString(); // 30 menit
  await supa.insert("password_resets", { token, email, expires_at: expiresAt, used: false });
  return token;
}

// ─── HELPERS ──────────────────────────────────────────────────────────────────
function localDateStr(d) {
  const y = d.getFullYear();
  const mo = String(d.getMonth()+1).padStart(2,"0");
  const dd = String(d.getDate()).padStart(2,"0");
  return `${y}-${mo}-${dd}`;
}
function todayStr() { return localDateStr(new Date()); }
function toMin(t) { const [h,m] = t.split(":").map(Number); return h*60+m; }
function addHour(t) { const [h,m] = t.split(":").map(Number); return `${String(Math.min(h+1,20)).padStart(2,"0")}:${String(m).padStart(2,"0")}`; }
// Hitung end_time dari start_time + durasi jam (desimal)
function autoEndTime(startTime, durationHours) {
  if (!startTime || !durationHours || durationHours <= 0) return null;
  const [h,m] = startTime.split(":").map(Number);
  const totalMin = h*60 + m + Math.round(durationHours * 60);
  const endH = Math.floor(totalMin / 60);
  const endM = totalMin % 60;
  return `${String(Math.min(endH, 23)).padStart(2,"0")}:${String(endM).padStart(2,"0")}`;
}
function fmtMonthYear(d) { return d.toLocaleDateString("id-ID",{month:"long",year:"numeric"}); }
function getWeekDays(base) {
  const d = new Date(base), mon = new Date(d), day = d.getDay();
  mon.setDate(d.getDate()-(day===0?6:day-1));
  return Array.from({length:7},(_,i)=>{ const dd=new Date(mon); dd.setDate(mon.getDate()+i); return dd; });
}
const HOURS = Array.from({length:13},(_,i)=>`${String(i+8).padStart(2,"0")}:00`);

function findConflict(bookings, candidate) {
  const cS = toMin(candidate.start_time), cE = toMin(candidate.end_time);
  return bookings.find(b => {
    if (b.id === candidate.id) return false;
    if (b.room_id !== candidate.room_id || b.date !== candidate.date) return false;
    return cS < toMin(b.end_time) && cE > toMin(b.start_time);
  }) || null;
}

function computeColumns(dayBookings) {
  const sorted = [...dayBookings].sort((a,b)=>toMin(a.start_time)-toMin(b.start_time));
  const colEnds = [];
  const withCol = sorted.map(b => {
    const bS = toMin(b.start_time), bE = toMin(b.end_time);
    let col = colEnds.findIndex(e => e <= bS);
    if (col === -1) { col = colEnds.length; colEnds.push(bE); } else { colEnds[col] = bE; }
    return { ...b, col };
  });
  return withCol.map(b => {
    const bS = toMin(b.start_time), bE = toMin(b.end_time);
    const overlapping = withCol.filter(o => bS < toMin(o.end_time) && bE > toMin(o.start_time));
    return { ...b, totalCols: Math.max(...overlapping.map(o=>o.col))+1 };
  });
}

// ─── TOAST ────────────────────────────────────────────────────────────────────
function useToast() {
  const [toasts, setToasts] = useState([]);
  const add = useCallback(({ icon="ℹ️", title, message, color }) => {
    const id = Date.now();
    setToasts(p=>[...p,{id,icon,title,message,color,leaving:false}]);
    setTimeout(()=>{
      setToasts(p=>p.map(t=>t.id===id?{...t,leaving:true}:t));
      setTimeout(()=>setToasts(p=>p.filter(t=>t.id!==id)),350);
    },3500);
  },[]);
  return { toasts, add };
}

// ─── LOGIN SCREEN ─────────────────────────────────────────────────────────────
// screen: "login" | "register" | "otp_register" | "forgot" | "otp_reset" | "new_password"
function LoginScreen({ onLogin }) {
  const [screen,   setScreen]   = useState("login");
  const [email,    setEmail]    = useState("");
  const [password, setPassword] = useState("");
  const [name,     setName]     = useState("");
  const [confirm,  setConfirm]  = useState("");
  const [otp,      setOtp]      = useState("");
  const [newPass,  setNewPass]  = useState("");
  const [newConf,  setNewConf]  = useState("");
  const [error,    setError]    = useState("");
  const [success,  setSuccess]  = useState("");
  const [loading,  setLoading]  = useState(false);
  const [resendCD, setResendCD] = useState(0); // countdown resend

  // Countdown timer for resend
  useEffect(() => {
    if (resendCD <= 0) return;
    const t = setTimeout(() => setResendCD(c => c-1), 1000);
    return () => clearTimeout(t);
  }, [resendCD]);

  const go = s => { setScreen(s); setError(""); setSuccess(""); setOtp(""); };

  // ── LOGIN ──
  const handleLogin = async e => {
    e.preventDefault(); setError(""); setLoading(true);
    try {
      const users = await supa.get("users", { email: `eq.${email}`, select: "*" });
      const user = users.find(u => u.password_hash === password || u.password_hash === btoa(password));
      if (!user) { setError("Email atau password salah."); setLoading(false); return; }
      const { password_hash, ...safe } = user;
      onLogin(safe);
    } catch(err) { setError("Gagal login: " + err.message); }
    setLoading(false);
  };

  // ── REGISTER step 1: kirim OTP ──
  const handleRegisterRequest = async e => {
    e.preventDefault();
    if (loading) return; // prevent double submit
    setError(""); setLoading(true);
    try {
      if (password.length < 6)   { setError("Password minimal 6 karakter."); setLoading(false); return; }
      if (password !== confirm)  { setError("Konfirmasi password tidak cocok."); setLoading(false); return; }
      const existing = await supa.get("users", { email: `eq.${email}` });
      if (existing.length > 0)   { setError("Email sudah terdaftar."); setLoading(false); return; }
      const code = generateOTP();
      storeOTP(email, code);
      await sendOTPEmail(name, email, code, false);
      setResendCD(60);
      go("otp_register");
      setSuccess(`Kode OTP dikirim ke ${email}. Berlaku 5 menit.`);
    } catch(err) { setError("Gagal mengirim OTP: " + (err?.message || err?.text || JSON.stringify(err))); }
    setLoading(false);
  };

  // ── REGISTER step 2: verifikasi OTP & buat akun ──
  const handleVerifyRegister = async e => {
    e.preventDefault(); setError(""); setLoading(true);
    try {
      const result = verifyOTP(email, otp.trim());
      if (result === "expired")   { setError("Kode OTP sudah kadaluarsa. Kirim ulang."); setLoading(false); return; }
      if (result !== "ok")        { setError("Kode OTP salah. Periksa kembali."); setLoading(false); return; }
      const initials = name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2);
      const role = ADMIN_EMAILS.includes(email) ? "admin"
               : CS_EMAILS.includes(email)     ? "cs"
               : "user";
      await supa.insert("users", { id: "u-"+Date.now(), name, email, role, password_hash: password });
      setSuccess("Akun berhasil dibuat! Silakan masuk.");
      setEmail(""); setPassword(""); setConfirm(""); setName(""); setOtp("");
      setTimeout(() => go("login"), 1500);
    } catch(err) { setError("Gagal membuat akun: " + err.message); }
    setLoading(false);
  };

  // ── RESEND OTP ──
  const handleResend = async (isReset=false) => {
    if (resendCD > 0) return;
    setError(""); setLoading(true);
    try {
      const code = generateOTP();
      storeOTP(email, code);
      await sendOTPEmail(name || email, email, code, isReset);
      setResendCD(60);
      setSuccess("Kode OTP baru sudah dikirim.");
    } catch(err) { setError("Gagal mengirim ulang: " + (err?.message || err?.text || JSON.stringify(err))); }
    setLoading(false);
  };

  // ── FORGOT PASSWORD: kirim link reset ──
  const handleForgotRequest = async e => {
    e.preventDefault(); setError(""); setLoading(true);
    try {
      const users = await supa.get("users", { email: `eq.${email}` });
      if (users.length === 0) { setError("Email tidak ditemukan."); setLoading(false); return; }
      const token = await createResetToken(email);
      const resetLink = `${BASE_URL}/reset-password.html?token=${token}`;
      await sendResetEmail(users[0].name, email, resetLink);
      go("forgot_sent");
    } catch(err) {
      console.error("Reset email error full:", err);
      const msg = err?.message || err?.text || JSON.stringify(err) || "unknown error";
      setError("Gagal mengirim email: " + msg);
    }
    setLoading(false);
  };


  const renderOTPBox = (onSubmit, onResend, isReset=false) => (
    <form onSubmit={onSubmit} className="space-y-5 fade-in">
      <div className="text-center">
        <div className="text-4xl mb-3">📨</div>
        <p className="text-sm text-slate-600">Masukkan 6-digit kode yang dikirim ke</p>
        <p className="font-semibold text-slate-800 text-sm">{email}</p>
      </div>
      <div>
        <input type="text" inputMode="numeric" maxLength={6} value={otp}
          onChange={e=>setOtp(e.target.value.replace(/\D/g,""))}
          autoFocus placeholder="000000"
          className="otp-input w-full border-2 border-slate-200 rounded-xl px-4 py-3 focus:outline-none focus:border-blue-500 focus:ring-2 focus:ring-blue-200"/>
      </div>
      {success && <AlertMsg msg={success} type="success"/>}
      {error   && <AlertMsg msg={error}/>}
      <button type="submit" disabled={loading || otp.length < 6}
        className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-50 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm">
        {loading ? "Memverifikasi..." : "Verifikasi Kode →"}
      </button>
      <div className="text-center text-xs text-slate-500">
        Tidak menerima kode?{" "}
        {resendCD > 0
          ? <span className="text-slate-400">Kirim ulang dalam {resendCD}s</span>
          : <button type="button" onClick={()=>onResend(isReset)} className="text-blue-500 hover:underline font-medium">Kirim Ulang</button>
        }
      </div>
      <button type="button" onClick={()=>go(isReset?"forgot":"register")}
        className="w-full text-slate-400 hover:text-slate-600 text-xs transition-colors">
        ← Kembali
      </button>
    </form>
  );

  return (
    <div className="min-h-screen bg-gradient-to-br from-blue-50 via-white to-indigo-50 flex items-center justify-center p-4">
      <div className="w-full max-w-md">
        <div className="text-center mb-8">
          <div className="flex justify-center mb-5"><MajooLogo/></div>
          <h1 className="text-2xl font-bold text-slate-800">Customer Support Agent Booking</h1>
          <p className="text-slate-500 text-sm mt-1">Silakan masuk untuk melanjutkan</p>
        </div>

        <div className="bg-white rounded-2xl shadow-xl border border-slate-100 p-8">

          {/* ── TAB: LOGIN ── */}
          {screen === "login" && (
            <div className="fade-in">
              <div className="flex gap-1 bg-slate-100 rounded-xl p-1 mb-6">
                <button className="flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-sm">Masuk</button>
                <button onClick={()=>go("register")} className="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-colors">Daftar</button>
              </div>
              <form onSubmit={handleLogin} className="space-y-4">
                <Field label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="email@majoo.id"/>
                <Field label="Password" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="••••••••"/>
                <AlertMsg msg={error}/>
                <button type="submit" disabled={loading}
                  className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm">
                  {loading ? "Memproses..." : "Masuk →"}
                </button>
                <div className="text-center">
                  <button type="button" onClick={()=>go("forgot")} className="text-xs text-blue-500 hover:underline">Lupa password?</button>
                </div>
              </form>
            </div>
          )}

          {/* ── TAB: REGISTER ── */}
          {screen === "register" && (
            <div className="fade-in">
              <div className="flex gap-1 bg-slate-100 rounded-xl p-1 mb-6">
                <button onClick={()=>go("login")} className="flex-1 py-2 text-sm font-semibold rounded-lg text-slate-500 hover:text-slate-700 transition-colors">Masuk</button>
                <button className="flex-1 py-2 text-sm font-semibold rounded-lg bg-blue-600 text-white shadow-sm">Daftar</button>
              </div>
              <form onSubmit={handleRegisterRequest} className="space-y-4">
                <Field label="Nama Lengkap" value={name} onChange={e=>setName(e.target.value)} placeholder="Nama Anda"/>
                <Field label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="email@majoo.id"/>
                <Field label="Password" type="password" value={password} onChange={e=>setPassword(e.target.value)} placeholder="Min. 6 karakter"/>
                <Field label="Konfirmasi Password" type="password" value={confirm} onChange={e=>setConfirm(e.target.value)} placeholder="Ulangi password"/>
                <AlertMsg msg={error}/>
                <button type="submit" disabled={loading}
                  className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm">
                  {loading ? "Mengirim OTP..." : "Daftar & Verifikasi Email →"}
                </button>
              </form>
            </div>
          )}

          {/* ── OTP REGISTER ── */}
          {screen === "otp_register" && renderOTPBox(handleVerifyRegister, handleResend, false)}

          {/* ── FORGOT PASSWORD ── */}
          {screen === "forgot" && (
            <div className="fade-in space-y-4">
              <div className="text-center mb-2">
                <div className="text-3xl mb-2">🔐</div>
                <h3 className="font-bold text-slate-800">Lupa Password</h3>
                <p className="text-xs text-slate-500 mt-1">Masukkan email kamu, kami kirim link reset password</p>
              </div>
              <form onSubmit={handleForgotRequest} className="space-y-4">
                <Field label="Email" type="email" value={email} onChange={e=>setEmail(e.target.value)} placeholder="email@majoo.id" autoFocus/>
                <AlertMsg msg={error}/>
                <button type="submit" disabled={loading}
                  className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm">
                  {loading ? "Mengirim..." : "Kirim Link Reset Password →"}
                </button>
                <button type="button" onClick={()=>go("login")} className="w-full text-slate-400 hover:text-slate-600 text-xs transition-colors">
                  ← Kembali ke Masuk
                </button>
              </form>
            </div>
          )}

          {/* ── FORGOT: link sent ── */}
          {screen === "forgot_sent" && (
            <div className="fade-in text-center space-y-4">
              <div className="text-5xl mb-2">📬</div>
              <h3 className="font-bold text-slate-800">Email Terkirim!</h3>
              <p className="text-sm text-slate-500">Link reset password sudah dikirim ke<br/><strong className="text-slate-700">{email}</strong></p>
              <p className="text-xs text-slate-400">Link berlaku 30 menit. Cek folder Spam jika tidak masuk.</p>
              <button onClick={()=>go("login")} className="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2.5 rounded-xl transition-colors shadow-sm text-sm">
                ← Kembali ke Masuk
              </button>
            </div>
          )}

        </div>
      </div>
    </div>
  );
}

    <aside className="w-60 min-w-[200px] bg-white border-r border-slate-200 flex flex-col h-full overflow-y-auto">

                    const on = selectedRooms.includes(room.id);
                    return (
                      <button key={room.id} onClick={()=>onToggle(room.id)}
                        className={`w-full text-left rounded-xl p-2.5 border-2 transition-all ${on?"shadow-sm":"border-slate-100 bg-slate-50 opacity-60"}`}
                        style={on?{borderColor:room.colorHex,backgroundColor:room.colorHex+"12"}:{}}>
                        <div className="flex items-center gap-2">

                    );

      </div>
    </aside>
  );
}

function BookingChip({ booking, room, currentUser, col, totalCols, onClick }) {
  const SLOT_H   = 56;
  const start    = toMin(booking.start_time) - toMin("08:00");
  const duration = toMin(booking.end_time)   - toMin(booking.start_time);
  const top    = (start/60)*SLOT_H;
  const height = Math.max((duration/60)*SLOT_H-4, 24);
  const GAP    = 2;
  const isOwn  = booking.booked_by_email === currentUser?.email;
  return (
    <div className="absolute rounded-lg px-2 py-1 booking-chip cursor-pointer shadow-sm hover:shadow-md hover:z-10 transition-shadow overflow-hidden"
      style={{
        top: top+"px", height: height+"px",
        left: `calc(${(col/totalCols)*100}% + ${col===0?4:GAP}px)`,
        width: `calc(${(1/totalCols)*100}% - ${col===0?GAP+4:GAP*2}px)`,
        backgroundColor: room.colorHex+"22",
        borderLeft: `3px solid ${room.colorHex}`,
        color: room.colorHex,
      }}
      onClick={()=>onClick(booking)}>
      <div className="font-semibold truncate leading-tight">{booking.title}</div>
      {height>28 && booking.activity && <div className="text-xs opacity-80 truncate">{booking.activity}</div>}
      {height>40 && <div className="text-xs opacity-70 truncate">{booking.start_time}–{booking.end_time}{booking.visit_type ? ` · ${booking.visit_type==="Online"?"🌐":"📍"}` : ""}</div>}
      {height>54 && (
        <div className="flex flex-wrap gap-0.5 mt-0.5">
          {booking.status_jadwal && STATUS_JADWAL_CFG[booking.status_jadwal] && (
            <span className="text-[9px] font-bold px-1 py-0.5 rounded leading-none truncate"
              style={{backgroundColor:STATUS_JADWAL_CFG[booking.status_jadwal].bg, color:STATUS_JADWAL_CFG[booking.status_jadwal].color}}>
              {STATUS_JADWAL_CFG[booking.status_jadwal].label}
            </span>
          )}
          {booking.status_assignment && STATUS_ASSIGN_CFG[booking.status_assignment] && (
            <span className="text-[9px] font-bold px-1 py-0.5 rounded leading-none truncate"
              style={{backgroundColor:STATUS_ASSIGN_CFG[booking.status_assignment].bg, color:STATUS_ASSIGN_CFG[booking.status_assignment].color}}>
              {STATUS_ASSIGN_CFG[booking.status_assignment].label}
            </span>
          )}
        </div>
      )}
    </div>
  );
}

// ─── HOLIDAY HELPERS ──────────────────────────────────────────────────────────
function isHoliday(holidays, roomId, dateStr) {
  const room = ROOMS.find(r => r.id === roomId);
  return holidays.some(h =>
    h.date === dateStr && (
      h.room_id === roomId ||
      (h.area === room?.area && !h.room_id) ||
      (!h.room_id && !h.area)  // berlaku semua
    )
  );
}

function getHolidayInfo(holidays, roomId, dateStr) {
  const room = ROOMS.find(r => r.id === roomId);
  return holidays.find(h =>
    h.date === dateStr && (
      h.room_id === roomId ||
      (h.area === room?.area && !h.room_id)
    )
  );
}


// ─── HOLIDAY LIST COMPONENT (accordion per agent) ────────────────────────────
function HolidayList({ holidays, onDelete }) {
  const [openKeys, setOpenKeys] = React.useState({});
  const toggle = key => setOpenKeys(p => ({...p, [key]: !p[key]}));

  if (holidays.length === 0) {
    return <div className="text-center text-slate-400 py-10 p-5">Belum ada jadwal libur</div>;
  }

  // Group by agent (room_id) or area
  const groups = {};
  holidays.forEach(h => {
    let key, label, color, sublabel;
    if (h.room_id) {
      const room = ROOMS.find(r => r.id === h.room_id);
      key      = "agent_" + h.room_id;
      label    = room?.name || "Agent #" + h.room_id;
      sublabel = room?.city || "";
      color    = room?.colorHex || "#64748b";
    } else if (h.area) {
      key      = "area_" + h.area;
      label    = "Area " + h.area;
      sublabel = "Semua agent";
      color    = AREA_COLORS[h.area] || "#64748b";
    } else {
      key      = "all";
      label    = "Semua Agent";
      sublabel = "";
      color    = "#64748b";
    }
    if (!groups[key]) groups[key] = { key, label, sublabel, color, items: [] };
    groups[key].items.push(h);
  });

  return (
    <div className="p-4 space-y-2">
      {Object.values(groups).map(g => {
        const isOpen = openKeys[g.key];
        const sorted = [...g.items].sort((a,b) => a.date.localeCompare(b.date));
        return (
          <div key={g.key} className="border border-slate-200 rounded-xl overflow-hidden">
            {/* Header accordion */}
            <button onClick={() => toggle(g.key)}
              className="w-full flex items-center justify-between px-4 py-3 hover:bg-slate-50 transition-colors">
              <div className="flex items-center gap-3">
                <span className="w-3 h-3 rounded-full flex-shrink-0" style={{backgroundColor: g.color}}/>
                <div className="text-left">
                  <div className="font-semibold text-sm text-slate-800">{g.label}</div>
                  {g.sublabel && <div className="text-xs text-slate-400">📍 {g.sublabel}</div>}
                </div>
              </div>
              <div className="flex items-center gap-2">
                <span className="text-xs font-semibold px-2 py-0.5 rounded-full bg-red-100 text-red-600">
                  {g.items.length} hari
                </span>
                <span className="text-slate-400 text-xs">{isOpen ? "▲" : "▼"}</span>
              </div>
            </button>
            {/* List tanggal */}
            {isOpen && (
              <div className="border-t border-slate-100 divide-y divide-slate-50">
                {sorted.map(h => (
                  <div key={h.id} className="flex items-center justify-between px-4 py-2.5 bg-red-50/40">
                    <div>
                      <div className="text-sm font-medium text-slate-700">
                        {new Date(h.date+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})}
                      </div>
                      <div className="text-xs text-slate-400 mt-0.5">📝 {h.reason || "Libur"}</div>
                    </div>
                    <button onClick={() => onDelete(h.id)}
                      className="ml-3 p-1.5 rounded-lg text-red-400 hover:text-red-600 hover:bg-red-100 transition-colors text-sm">
                      🗑
                    </button>
                  </div>
                ))}
              </div>
            )}
          </div>
        );
      })}
    </div>
  );
}

// ─── HOLIDAY MODAL ────────────────────────────────────────────────────────────
function HolidayModal({ isOpen, onClose, holidays, onSave, onDelete, currentUser }) {
  const today = new Date();
  const [viewYear,  setViewYear]  = React.useState(today.getFullYear());
  const [viewMonth, setViewMonth] = React.useState(today.getMonth());
  const [selected,  setSelected]  = React.useState([]);  // array of 'YYYY-MM-DD'
  const [scope,     setScope]     = React.useState("area"); // "area" | "agent"
  const [selArea,   setSelArea]   = React.useState(null);
  const [selAgents, setSelAgents] = React.useState([]);  // array of room_id
  const [reason,    setReason]    = React.useState("Libur");
  const [loading,   setLoading]   = React.useState(false);
  const [tab,       setTab]       = React.useState("set"); // "set" | "list"

  if (!isOpen) return null;

  // Build calendar days for current viewMonth
  const firstDay = new Date(viewYear, viewMonth, 1);
  const lastDay  = new Date(viewYear, viewMonth + 1, 0);
  const startDow = (firstDay.getDay() + 6) % 7; // Monday=0
  const calDays  = [];
  for (let i = 0; i < startDow; i++) calDays.push(null);
  for (let d = 1; d <= lastDay.getDate(); d++) {
    const dt = new Date(viewYear, viewMonth, d);
    calDays.push(localDateStr(dt));
  }

  const monthLabel = firstDay.toLocaleDateString("id-ID", { month: "long", year: "numeric" });
  const DOW_LABELS = ["Sen","Sel","Rab","Kam","Jum","Sab","Min"];

  const toggleDate = (dateStr) => {
    setSelected(p => p.includes(dateStr) ? p.filter(d => d !== dateStr) : [...p, dateStr]);
  };

  const toggleAgent = (id) => {
    setSelAgents(p => p.includes(id) ? p.filter(x => x !== id) : [...p, id]);
  };

  const areaAgents = selArea ? ROOMS.filter(r => r.area === selArea) : [];

  const handleSave = async () => {
    if (selected.length === 0) return alert("Pilih minimal 1 tanggal.");
    if (scope === "area" && !selArea) return alert("Pilih area.");
    if (scope === "agent" && selAgents.length === 0) return alert("Pilih minimal 1 agent.");
    setLoading(true);
    try {
      const entries = [];
      if (scope === "area") {
        for (const date of selected) {
          entries.push({ id: "hol-" + Date.now() + "-" + Math.random().toString(36).slice(2),
            area: selArea, room_id: null, date, reason, created_by: currentUser?.email });
        }
      } else {
        for (const date of selected) {
          for (const rid of selAgents) {
            entries.push({ id: "hol-" + Date.now() + "-" + Math.random().toString(36).slice(2),
              room_id: rid, area: null, date, reason, created_by: currentUser?.email });
          }
        }
      }
      for (const entry of entries) {
        await supa.insert("holidays", entry);
      }
      await onSave();
      setSelected([]);
      alert(`✅ ${entries.length} jadwal libur berhasil disimpan!`);
    } catch(e) { alert("Gagal menyimpan: " + e.message); }
    setLoading(false);
  };

  const handleDelete = async (id) => {
    if (!window.confirm("Hapus jadwal libur ini?")) return;
    try {
      await fetch(`${SUPA_URL}/rest/v1/holidays?id=eq.${id}`, { method:"DELETE", headers: supa.headers });
      await onSave();
    } catch(e) { alert("Gagal hapus: " + e.message); }
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-2xl mx-4 max-h-[92vh] flex flex-col overflow-hidden">
        {/* Header */}
        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between flex-shrink-0">
          <div className="flex items-center gap-3">
            <span className="text-2xl">🏖️</span>
            <h2 className="text-lg font-bold text-slate-800">Kelola Jadwal Libur</h2>
          </div>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>

        {/* Tabs */}
        <div className="flex border-b border-slate-100 flex-shrink-0">
          {[["set","📅 Set Libur"],["list","📋 Daftar Libur"]].map(([k,label])=>(
            <button key={k} onClick={()=>setTab(k)}
              className={`flex-1 py-2.5 text-sm font-semibold transition-colors ${tab===k?"text-blue-600 border-b-2 border-blue-600":"text-slate-400 hover:text-slate-600"}`}>
              {label}
            </button>
          ))}
        </div>

        <div className="flex-1 overflow-y-auto">
          {/* ── TAB SET LIBUR ── */}
          {tab === "set" && (
            <div className="p-5 space-y-5">
              {/* Month navigator */}
              <div className="flex items-center justify-between">
                <button onClick={()=>{ let m=viewMonth-1,y=viewYear; if(m<0){m=11;y--;} setViewMonth(m);setViewYear(y); setSelected([]); }}
                  className="p-2 rounded-lg hover:bg-slate-100 text-slate-600 font-bold">◀</button>
                <span className="font-bold text-slate-800 capitalize">{monthLabel}</span>
                <button onClick={()=>{ let m=viewMonth+1,y=viewYear; if(m>11){m=0;y++;} setViewMonth(m);setViewYear(y); setSelected([]); }}
                  className="p-2 rounded-lg hover:bg-slate-100 text-slate-600 font-bold">▶</button>
              </div>

              {/* Calendar grid */}
              <div>
                <div className="grid grid-cols-7 mb-1">
                  {DOW_LABELS.map(d=>(
                    <div key={d} className={`text-center text-xs font-semibold py-1 ${d==="Min"?"text-red-400":"text-slate-400"}`}>{d}</div>
                  ))}
                </div>
                <div className="grid grid-cols-7 gap-1">
                  {calDays.map((dateStr, idx) => {
                    if (!dateStr) return <div key={idx}/>;
                    const isSelected  = selected.includes(dateStr);
                    const dow         = new Date(dateStr).getDay(); // 0=Sun
                    const isSun       = dow === 0;
                    return (
                      <button key={dateStr} onClick={() => toggleDate(dateStr)}
                        className={`aspect-square rounded-lg text-sm font-semibold transition-all border-2

              <div>

                    )}
                    {selAgents.length > 0 && (
                      <div className="text-xs text-blue-600 bg-blue-50 rounded px-2 py-1">{selAgents.length} agent dipilih</div>
                    )}
                  </div>
                )}
              </div>

              {/* Reason */}
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wider mb-1.5">Keterangan Libur</label>
                <input type="text" value={reason} onChange={e=>setReason(e.target.value)}
                  placeholder="cth. Libur Nasional, Cuti Bersama..."
                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
              </div>

              <button onClick={handleSave} disabled={loading || selected.length===0}
                className="w-full bg-orange-500 hover:bg-orange-600 disabled:opacity-50 text-white font-semibold py-3 rounded-xl transition-colors shadow-sm">
                {loading ? "Menyimpan..." : `🏖️ Simpan ${selected.length} Hari Libur`}
              </button>
            </div>
          )}

          {/* ── TAB DAFTAR LIBUR ── */}
          {tab === "list" && (
            <HolidayList holidays={holidays} onDelete={handleDelete}/>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── BOOKING MODAL ────────────────────────────────────────────────────────────
function BookingModal({ isOpen, onClose, onSave, onDelete, rooms, initialData, bookings, currentUser, holidays, lockedRoomId }) {
  const isEdit = !!initialData?.id;
  const blank  = { room_id:rooms[0]?.id, title:"", date:todayStr(), start_time:"09:00", end_time:"10:00", attendees:"", notes:"", visit_type:"Online", activity:"", status_jadwal:"", status_assignment:"Need Assign CRM" };
  const [form,     setForm]     = useState(blank);
  const [conflict, setConflict] = useState(null);
  const [loading,  setLoading]  = useState(false);

  useEffect(()=>{ if(isOpen){ setForm({...blank,...(initialData||{})}); setConflict(null); } },[isOpen,initialData]);
  if (!isOpen) return null;

  // Cari data activity dari ACTIVITY_LIST
  const getActivityData = (actName, visitType) =>
    ACTIVITY_LIST.find(a => a.name === actName && (a.type === visitType || a.type === "Both"));

  const set = (k, v) => {
    let up = {...form, [k]: v};
    // Reset activity saat visit_type berubah
    if (k === "visit_type") up = {...up, activity: ""};
    // Auto-hitung end_time saat activity atau start_time berubah
    if (k === "activity" || k === "start_time") {
      const actName  = k === "activity"    ? v : up.activity;
      const startT   = k === "start_time"  ? v : up.start_time;
      const actData  = getActivityData(actName, up.visit_type);
      if (actData && actData.duration > 0) {
        const newEnd = autoEndTime(startT, actData.duration);
        if (newEnd) up = {...up, end_time: newEnd};
      }
    }
    setForm(up);
    if (up.room_id && up.date && up.start_time && up.end_time)
      setConflict(findConflict(bookings, up));
  };

  const canEdit = !isEdit || initialData?.booked_by_email===currentUser?.email || currentUser?.role==="admin";

  const submit = async e => {
    e.preventDefault();
    if (!form.activity) { alert("Pilih category activity terlebih dahulu."); return; }
    if (conflict || loading) return;
    setLoading(true);
    await onSave({...form, booked_by_name:currentUser?.name, booked_by_email:currentUser?.email});
    setLoading(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-lg mx-4 max-h-[90vh] overflow-y-auto">
        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between sticky top-0 bg-white z-10">
          <h2 className="text-lg font-bold text-slate-800">{isEdit?"✏️ Edit Booking":"📅 Booking Baru"}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>
        <form onSubmit={submit} className="p-6 space-y-4">

          {/* ── Visit Type ── */}
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Type Visit *</label>
            <div className="flex gap-2">
              {["Online","Offline"].map(vt => (
                <button type="button" key={vt} disabled={!canEdit}
                  onClick={() => set("visit_type", vt)}
                  className={`flex-1 py-2 rounded-lg border-2 text-sm font-semibold transition-all ${form.visit_type===vt
                    ? (vt==="Online"
                        ? "border-blue-500 bg-blue-50 text-blue-700"
                        : "border-orange-500 bg-orange-50 text-orange-700")
                    : "border-slate-100 bg-slate-50 text-slate-500 hover:bg-slate-100"}`}>
                  {vt === "Online" ? "🌐 Online" : "📍 Offline"}
                </button>
              ))}
            </div>
          </div>

          {/* ── Activity ── */}
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Category Activity *</label>
            {(() => {
              const acts = ACTIVITY_LIST.filter(a => a.type === form.visit_type || a.type === "Both");
              const sel  = getActivityData(form.activity, form.visit_type);
              return (
                <div>
                  <select required value={form.activity} disabled={!canEdit}
                    onChange={e => set("activity", e.target.value)}
                    className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50 bg-white">
                    <option value="">— Pilih activity —</option>
                    {acts.map(a => (
                      <option key={a.type+a.name} value={a.name}>
                        {a.name}{a.duration > 0 ? ` (${a.duration} jam)` : " (durasi manual)"}
                      </option>
                    ))}
                  </select>
                  {sel && sel.duration > 0 && (
                    <div className="mt-1 text-xs text-blue-600 flex items-center gap-1">
                      <span>⏱</span>
                      <span>Durasi <strong>{sel.duration} jam</strong> — waktu selesai otomatis dihitung dari jam mulai</span>
                    </div>
                  )}
                  {sel && sel.duration === 0 && (
                    <div className="mt-1 text-xs text-amber-600 flex items-center gap-1">
                      <span>⚠️</span>
                      <span>Durasi tidak tetap — isi waktu selesai secara manual</span>
                    </div>
                  )}
                </div>
              );
            })()}
          </div>

          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Nama / Keterangan Meeting *</label>
            <input type="text" required placeholder="cth. Training Sprint Planning, Visit PT. XYZ..." value={form.title}
              onChange={e=>set("title",e.target.value)} disabled={!canEdit}
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
          </div>
          {lockedRoomId ? (
            /* CS Role: tampilkan agent readonly */
            (() => {
              const myRoom = rooms.find(r => r.id === lockedRoomId);
              return myRoom ? (
                <div>
                  <label className="block text-xs font-semibold text-slate-500 mb-1.5 uppercase tracking-wider">Customer Support Agent</label>
                  <div className="flex items-center gap-2.5 rounded-xl p-3 border-2"
                    style={{borderColor:myRoom.colorHex, backgroundColor:myRoom.colorHex+"12"}}>
                    <span className="w-3 h-3 rounded-full flex-shrink-0" style={{backgroundColor:myRoom.colorHex}}/>
                    <div>
                      <div className="text-sm font-bold text-slate-800">{myRoom.name}</div>
                      <div className="text-xs text-slate-500">📍 {myRoom.city} · {myRoom.area}</div>
                    </div>
                  </div>
                </div>
              ) : null;
            })()
          ) : (
            <AreaAgentPicker rooms={rooms} form={form} set={set} canEdit={canEdit}/>
          )}
          <div className="grid grid-cols-3 gap-3">
            <div className="col-span-3 sm:col-span-1">
              <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Tanggal *</label>
              <input type="date" required value={form.date} onChange={e=>set("date",e.target.value)} disabled={!canEdit}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Mulai *</label>
              <input type="time" required value={form.start_time} onChange={e=>set("start_time",e.target.value)} disabled={!canEdit}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
            </div>
            <div>
              <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Selesai *</label>
              <input type="time" required value={form.end_time} onChange={e=>set("end_time",e.target.value)} disabled={!canEdit}
                className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
            </div>
          </div>
          {conflict && (
            <div className="bg-red-50 border border-red-300 rounded-lg px-4 py-3 text-sm text-red-700 flex items-start gap-2">
              <span className="text-lg flex-shrink-0">⚠️</span>
              <div><strong>Konflik Jadwal!</strong> Sudah dibooking untuk <strong>"{conflict.title}"</strong> pukul {conflict.start_time}–{conflict.end_time} oleh {conflict.booked_by_name||"pengguna lain"}.</div>
            </div>
          )}
          {!conflict && form.room_id && form.date && isHoliday(holidays||[], form.room_id, form.date) && (
            <div className="bg-orange-50 border border-orange-300 rounded-lg px-4 py-3 text-sm text-orange-700 flex items-start gap-2">
              <span className="text-lg flex-shrink-0">🏖️</span>
              <div><strong>Hari Libur!</strong> Agent ini dijadwalkan libur pada tanggal tersebut. Booking tidak dapat dilakukan.</div>
            </div>
          )}
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Peserta</label>
            <input type="text" placeholder="cth. Tim Product, Budi, +3" value={form.attendees}
              onChange={e=>set("attendees",e.target.value)} disabled={!canEdit}
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 disabled:bg-slate-50"/>
          </div>
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Catatan</label>
            <textarea placeholder="Catatan opsional..." value={form.notes} onChange={e=>set("notes",e.target.value)}
              rows={2} disabled={!canEdit}
              className="w-full border border-slate-200 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500 resize-none disabled:bg-slate-50"/>
          </div>

          {/* ── Status Jadwal ── */}
          <div>
            <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Status Jadwal</label>
            <div className="flex gap-2">
              {STATUS_JADWAL_OPTS.map(s => {
                const cfg = STATUS_JADWAL_CFG[s];
                const isOn = form.status_jadwal === s;
                return (
                  <button type="button" key={s} disabled={!canEdit}
                    onClick={() => set("status_jadwal", isOn ? "" : s)}
                    className="flex-1 py-2 rounded-lg border-2 text-xs font-semibold transition-all"
                    style={isOn
                      ? { borderColor:cfg.color, backgroundColor:cfg.bg, color:cfg.color }
                      : { borderColor:"#e2e8f0", backgroundColor:"#f8fafc", color:"#94a3b8" }}>
                    {cfg.label}
                  </button>
                );
              })}
            </div>
          </div>

          {/* ── Status Assignment (admin only saat edit) ── */}
          {currentUser?.role === "admin" && isEdit && (
            <div>
              <label className="block text-xs font-semibold text-slate-500 mb-1 uppercase tracking-wider">Status Assignment</label>
              <div className="flex gap-2">
                {Object.entries(STATUS_ASSIGN_CFG).map(([key, cfg]) => {
                  const isOn = form.status_assignment === key;
                  return (
                    <button type="button" key={key}
                      onClick={() => set("status_assignment", key)}
                      className="flex-1 py-2 rounded-lg border-2 text-xs font-semibold transition-all"
                      style={isOn
                        ? { borderColor:cfg.color, backgroundColor:cfg.bg, color:cfg.color }
                        : { borderColor:"#e2e8f0", backgroundColor:"#f8fafc", color:"#94a3b8" }}>
                      {cfg.label}
                    </button>
                  );
                })}
              </div>
            </div>
          )}

          {/* Readonly status assignment untuk non-admin */}
          {currentUser?.role !== "admin" && form.status_assignment && STATUS_ASSIGN_CFG[form.status_assignment] && (
            <div className="flex items-center gap-2">
              <label className="text-xs font-semibold text-slate-500 uppercase tracking-wider">Status Assignment:</label>
              <span className="text-xs font-bold px-2 py-1 rounded-full"
                style={{backgroundColor:STATUS_ASSIGN_CFG[form.status_assignment].bg, color:STATUS_ASSIGN_CFG[form.status_assignment].color}}>
                {STATUS_ASSIGN_CFG[form.status_assignment].label}
              </span>
            </div>
          )}

          {isEdit && initialData?.booked_by_name && (
            <div className="text-xs text-slate-400">👤 Dibooking oleh: <span className="font-medium text-slate-600">{initialData.booked_by_name}</span></div>
          )}
          <div className="flex gap-2 pt-1">
            {isEdit && canEdit && (
              <button type="button" onClick={()=>onDelete(form.id)}
                className="px-4 py-2 rounded-lg border border-red-200 text-red-500 text-sm font-medium hover:bg-red-50">
                🗑 Hapus
              </button>
            )}
            <div className="flex-1"/>
            <button type="button" onClick={onClose}
              className="px-4 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">Batal</button>
            {canEdit && (
              <button type="submit" disabled={!!conflict||loading||(form.room_id&&form.date&&isHoliday(holidays||[],form.room_id,form.date))}
                className="px-5 py-2 rounded-xl bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700 disabled:opacity-50 shadow-sm">
                {loading ? "Menyimpan..." : isEdit?"Simpan":"Booking Sekarang"}
              </button>
            )}
          </div>
        </form>
      </div>
    </div>
  );
}

// ─── DETAIL MODAL ─────────────────────────────────────────────────────────────
function DetailModal({ booking, room, onClose, onEdit, onDelete, onUpdateStatus, currentUser }) {
  if (!booking) return null;
  const [updatingStatus, setUpdatingStatus] = useState(false);
  const isOwner = booking.booked_by_email === currentUser?.email;
  const canAct  = isOwner || currentUser?.role === "admin";
  const isAdmin = currentUser?.role === "admin";

  const jadwalCfg = STATUS_JADWAL_CFG[booking.status_jadwal];
  const assignCfg = STATUS_ASSIGN_CFG[booking.status_assignment];

  const handleToggleAssign = async () => {
    const next = booking.status_assignment === "Need Assign CRM" ? "Done Assign CRM" : "Need Assign CRM";
    setUpdatingStatus(true);
    await onUpdateStatus(booking.id, { status_assignment: next });
    setUpdatingStatus(false);
  };

  const rows = [
    {icon:"🏢", label:"Agent",   val:room.name + (room.city ? ` — 📍 ${room.city}` : "")},
    booking.visit_type && {icon: booking.visit_type==="Online"?"🌐":"📍", label:"Type Visit", val: booking.visit_type},
    booking.activity   && {icon:"⚡", label:"Activity",  val: booking.activity},
    {icon:"📅", label:"Tanggal",val:new Date(booking.date+"T00:00").toLocaleDateString("id-ID",{weekday:"long",day:"numeric",month:"long",year:"numeric"})},
    {icon:"🕐", label:"Waktu",  val:`${booking.start_time} – ${booking.end_time}`},
    booking.attendees      && {icon:"👥",label:"Peserta",        val:booking.attendees},
    booking.booked_by_name && {icon:"👤",label:"Dibooking oleh", val:booking.booked_by_name},
    booking.notes          && {icon:"📝",label:"Catatan",        val:booking.notes},
  ].filter(Boolean);

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center modal-overlay bg-black/30">
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-sm mx-4 overflow-hidden">
        <div className="h-2" style={{backgroundColor:room.colorHex}}/>
        <div className="px-6 py-4 border-b border-slate-100 flex items-center justify-between">
          <h2 className="text-base font-bold text-slate-800 pr-2">{booking.title}</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
        </div>

        {/* Status badges row */}
        <div className="px-6 pt-4 flex flex-wrap gap-2">
          {jadwalCfg ? (
            <span className="text-xs font-bold px-2.5 py-1 rounded-full"
              style={{backgroundColor:jadwalCfg.bg, color:jadwalCfg.color}}>
              {jadwalCfg.label}
            </span>
          ) : (
            <span className="text-xs font-medium px-2.5 py-1 rounded-full bg-slate-100 text-slate-400">
              ⬜ Status belum diset
            </span>
          )}
          {assignCfg && (
            <span className="text-xs font-bold px-2.5 py-1 rounded-full"
              style={{backgroundColor:assignCfg.bg, color:assignCfg.color}}>
              {assignCfg.label}
            </span>
          )}
        </div>

        <div className="p-6 space-y-3 text-sm">
          {rows.map(r=>(
            <div key={r.label} className="flex items-start gap-3">
              <span className="w-8 text-center text-base flex-shrink-0">{r.icon}</span>
              <div><div className="font-medium text-slate-700">{r.val}</div><div className="text-xs text-slate-400">{r.label}</div></div>
            </div>
          ))}
        </div>

        {/* Admin: quick toggle status assignment */}
        {isAdmin && (
          <div className="mx-6 mb-4 bg-slate-50 border border-slate-200 rounded-xl px-4 py-3">
            <div className="text-xs font-semibold text-slate-500 mb-2 uppercase tracking-wider">Update Status Assignment</div>
            <button onClick={handleToggleAssign} disabled={updatingStatus}
              className="w-full py-2 rounded-lg text-xs font-bold transition-all disabled:opacity-50"
              style={booking.status_assignment === "Need Assign CRM"
                ? { backgroundColor: STATUS_ASSIGN_CFG["Done Assign CRM"].bg, color: STATUS_ASSIGN_CFG["Done Assign CRM"].color, border: `1.5px solid ${STATUS_ASSIGN_CFG["Done Assign CRM"].color}` }
                : { backgroundColor: STATUS_ASSIGN_CFG["Need Assign CRM"].bg, color: STATUS_ASSIGN_CFG["Need Assign CRM"].color, border: `1.5px solid ${STATUS_ASSIGN_CFG["Need Assign CRM"].color}` }}>
              {updatingStatus ? "Menyimpan..." : booking.status_assignment === "Need Assign CRM"
                ? "→ Tandai Done Assign CRM"
                : "→ Kembalikan ke Need Assign CRM"}
            </button>
          </div>
        )}

        {!canAct && (
          <div className="mx-6 mb-4 bg-amber-50 border border-amber-200 rounded-xl px-4 py-3 text-xs text-amber-800">
            Booking ini milik <strong>{booking.booked_by_name||"karyawan lain"}</strong>. Hanya pemilik atau Admin yang dapat mengubahnya.
          </div>
        )}
        <div className="px-6 pb-5 flex gap-2">
          <button onClick={onClose} className="flex-1 py-2 rounded-lg border border-slate-200 text-slate-600 text-sm font-medium hover:bg-slate-50">Tutup</button>
          {canAct && isAdmin && (
            <button onClick={()=>onEdit(booking)} className="flex-1 py-2 rounded-lg bg-blue-600 text-white text-sm font-semibold hover:bg-blue-700">Edit</button>
          )}
          {canAct && (
            <button onClick={()=>{ if(window.confirm("Batalkan booking ini?")) onDelete(booking.id); }}
              className="flex-1 py-2 rounded-lg bg-red-500 text-white text-sm font-semibold hover:bg-red-600">
              Batalkan
            </button>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── NOTIF HELPERS (localStorage) ────────────────────────────────────────────
function loadNotifLogs(userId) {
  try { return JSON.parse(localStorage.getItem("roombook_notifs_" + userId) || "[]"); } catch { return []; }
}
function saveNotifLogs(userId, logs) {
  try { localStorage.setItem("roombook_notifs_" + userId, JSON.stringify(logs.slice(-50))); } catch {} // simpan max 50
}
function countUnread(logs) { return logs.filter(l => !l.read).length; }

// ─── NOTIF PANEL ──────────────────────────────────────────────────────────────
function NotifPanel({ logs, onClose, onMarkAllRead, onClearAll }) {
  const unread = countUnread(logs);
  return (
    <div className="fixed inset-0 z-50 flex justify-end modal-overlay bg-black/20" onClick={onClose}>
      <div className="w-full max-w-sm bg-white shadow-2xl flex flex-col h-full" onClick={e=>e.stopPropagation()}>
        <div className="px-5 py-4 border-b border-slate-200 flex items-center justify-between">
          <div className="flex items-center gap-2">
            <h2 className="font-bold text-slate-800">🔔 Riwayat Aktivitas</h2>
            {unread > 0 && <span className="bg-red-500 text-white text-xs rounded-full px-1.5 py-0.5 font-bold">{unread} baru</span>}
          </div>
          <div className="flex items-center gap-2">
            {logs.length > 0 && <button onClick={onClearAll} className="text-xs text-slate-400 hover:text-red-500 transition-colors">Hapus Semua</button>}
            <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-2xl leading-none">&times;</button>
          </div>
        </div>
        <div className="flex-1 overflow-y-auto p-4 space-y-3">
          {logs.length === 0
            ? <div className="text-center text-slate-400 text-sm py-10">Belum ada aktivitas</div>
            : [...logs].reverse().map(log => (
              <div key={log.id} className={`border rounded-xl p-3 transition-colors ${log.read ? "bg-white border-slate-100" : "bg-blue-50 border-blue-200"}`}>
                <div className="flex items-start gap-2">
                  <span className="text-lg flex-shrink-0">{log.icon}</span>
                  <div className="flex-1 min-w-0">
                    <div className={`font-semibold text-sm ${log.read ? "text-slate-700" : "text-slate-900"}`}>{log.title}</div>
                    <div className="text-xs text-slate-500 mt-0.5">{log.message}</div>
                    <div className="text-xs text-slate-400 mt-1">
                      {new Date(log.ts).toLocaleDateString("id-ID",{day:"2-digit",month:"short"})} · {new Date(log.ts).toLocaleTimeString("id-ID",{hour:"2-digit",minute:"2-digit"})}
                    </div>
                  </div>
                  {!log.read && <div className="w-2 h-2 rounded-full bg-blue-500 flex-shrink-0 mt-1.5"></div>}
                </div>
              </div>
            ))
          }
        </div>
        {unread > 0 && (
          <div className="px-5 py-3 border-t border-slate-100">
            <button onClick={onMarkAllRead} className="w-full text-sm text-blue-600 hover:text-blue-700 font-semibold py-1">
              Tandai Semua Sudah Dibaca
            </button>
          </div>
        )}
      </div>
    </div>
  );
}

// ─── ACCOUNT SETTINGS MODAL ───────────────────────────────────────────────────
function AccountModal({ currentUser, onClose, onUpdate }) {
  const [name,        setName]        = useState(currentUser.name || "");
  const [photo,       setPhoto]       = useState(currentUser.photo || "");
  const [oldPass,     setOldPass]     = useState("");
  const [newPass,     setNewPass]     = useState("");
  const [confirmPass, setConfirmPass] = useState("");
  const [loading,     setLoading]     = useState(false);
  const [error,       setError]       = useState("");
  const [success,     setSuccess]     = useState("");
  const [tab,         setTab]         = useState("profile"); // "profile" | "password"

  const initials = name.split(" ").map(w=>w[0]).join("").toUpperCase().slice(0,2) || "?";

  const handlePhotoChange = e => {
    const file = e.target.files[0];
    if (!file) return;
    if (file.size > 2*1024*1024) { setError("Foto maksimal 2MB."); return; }
    const reader = new FileReader();
    reader.onload = ev => setPhoto(ev.target.result);
    reader.readAsDataURL(file);
  };

  const saveProfile = async e => {
    e.preventDefault();
    setError(""); setSuccess(""); setLoading(true);
    try {
      if (!name.trim()) { setError("Nama tidak boleh kosong."); setLoading(false); return; }
      const newName = name.trim();
      // Simpan nama ke Supabase (tabel users)
      await supa.update("users", currentUser.id, { name: newName });
      // Update semua booking milik user ini dengan nama baru
      if (newName !== currentUser.name) {
        await fetch(`${SUPA_URL}/rest/v1/bookings?booked_by_email=eq.${encodeURIComponent(currentUser.email)}`, {
          method: "PATCH",
          headers: { ...supa.headers },
          body: JSON.stringify({ booked_by_name: newName })
        });
      }
      // Simpan foto ke localStorage
      if (photo) localStorage.setItem("roombook_photo_" + currentUser.id, photo);
      const updated = { ...currentUser, name: newName, photo: photo || currentUser.photo };
      onUpdate(updated);
      setSuccess("Profil berhasil disimpan!");
    } catch(err) { setError("Gagal menyimpan: " + err.message); }
    setLoading(false);
  };

  const savePassword = async e => {
    e.preventDefault();
    setError(""); setSuccess(""); setLoading(true);
    try {
      if (!oldPass) { setError("Masukkan password lama."); setLoading(false); return; }
      if (newPass.length < 6) { setError("Password baru minimal 6 karakter."); setLoading(false); return; }
      if (newPass !== confirmPass) { setError("Konfirmasi password tidak cocok."); setLoading(false); return; }
      // Verifikasi password lama
      const users = await supa.get("users", { id: `eq.${currentUser.id}` });
      if (!users.length || users[0].password_hash !== oldPass) { setError("Password lama salah."); setLoading(false); return; }
      await supa.update("users", currentUser.id, { password_hash: newPass });
      setOldPass(""); setNewPass(""); setConfirmPass("");
      setSuccess("Password berhasil diubah!");
    } catch(err) { setError("Gagal mengubah password: " + err.message); }
    setLoading(false);
  };

  return (
    <div className="fixed inset-0 z-50 flex items-center justify-center p-4" style={{background:"rgba(0,0,0,0.4)"}}>
      <div className="bg-white rounded-2xl shadow-2xl w-full max-w-md overflow-hidden">
        {/* Header */}
        <div className="flex items-center justify-between px-6 py-4 border-b border-slate-100">
          <h2 className="font-bold text-slate-800 text-lg">Pengaturan Akun</h2>
          <button onClick={onClose} className="text-slate-400 hover:text-slate-600 text-xl leading-none">×</button>
        </div>

        {/* Tabs */}
        <div className="flex border-b border-slate-100">
          {["profile","password"].map(t => (
            <button key={t} onClick={()=>{setTab(t);setError("");setSuccess("");}}
              className={`flex-1 py-2.5 text-sm font-semibold transition-colors ${tab===t?"text-blue-600 border-b-2 border-blue-600":"text-slate-400 hover:text-slate-600"}`}>
              {t==="profile" ? "Profil" : "Password"}
            </button>
          ))}
        </div>

        <div className="p-6">
          {/* Alert */}
          {error   && <div className="mb-4 bg-red-50 border border-red-200 text-red-700 text-sm rounded-xl px-4 py-3">⚠ {error}</div>}
          {success && <div className="mb-4 bg-green-50 border border-green-200 text-green-700 text-sm rounded-xl px-4 py-3">✓ {success}</div>}

          {/* Tab Profil */}
          {tab === "profile" && (
            <form onSubmit={saveProfile} className="space-y-5">
              {/* Foto */}
              <div className="flex flex-col items-center gap-3">
                <div className="relative">
                  {photo
                    ? <img src={photo} alt="avatar" className="w-20 h-20 rounded-full object-cover border-2 border-slate-200"/>
                    : <div className="w-20 h-20 rounded-full bg-blue-600 text-white text-2xl font-bold flex items-center justify-center">{initials}</div>
                  }
                  <label className="absolute -bottom-1 -right-1 bg-white border border-slate-200 rounded-full p-1.5 cursor-pointer hover:bg-slate-50 shadow-sm">
                    <svg className="w-3.5 h-3.5 text-slate-600" fill="none" stroke="currentColor" strokeWidth="2" viewBox="0 0 24 24"><path d="M15.232 5.232l3.536 3.536M9 13l6.586-6.586a2 2 0 112.828 2.828L11.828 15.828A2 2 0 019 17H7v-2a2 2 0 01.586-1.414z"/></svg>
                    <input type="file" accept="image/*" onChange={handlePhotoChange} className="hidden"/>
                  </label>
                </div>
                <p className="text-xs text-slate-400">Klik ikon pensil untuk ganti foto (maks. 2MB)</p>
              </div>

              {/* Nama */}
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Nama Lengkap</label>
                <input type="text" value={name} onChange={e=>setName(e.target.value)}
                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
              </div>

              {/* Email (disabled) */}
              <div>
                <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">Email</label>
                <input type="email" value={currentUser.email} disabled
                  className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm bg-slate-50 text-slate-400 cursor-not-allowed"/>
                <p className="text-xs text-slate-400 mt-1">Email tidak dapat diubah.</p>
              </div>

              <button type="submit" disabled={loading}
                className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition-colors">
                {loading ? "Menyimpan..." : "Simpan Profil"}
              </button>
            </form>
          )}

          {/* Tab Password */}
          {tab === "password" && (
            <form onSubmit={savePassword} className="space-y-4">
              {[
                {label:"Password Lama", val:oldPass, set:setOldPass},
                {label:"Password Baru", val:newPass, set:setNewPass},
                {label:"Konfirmasi Password Baru", val:confirmPass, set:setConfirmPass},
              ].map(({label,val,set}) => (
                <div key={label}>
                  <label className="block text-xs font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{label}</label>
                  <input type="password" value={val} onChange={e=>set(e.target.value)}
                    className="w-full border border-slate-200 rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"/>
                </div>
              ))}
              <button type="submit" disabled={loading}
                className="w-full bg-blue-600 hover:bg-blue-700 disabled:opacity-60 text-white font-semibold py-2.5 rounded-xl transition-colors">
                {loading ? "Mengubah..." : "Ubah Password"}
              </button>
            </form>
          )}
        </div>
      </div>
    </div>
  );
}

// ─── MAIN APP ─────────────────────────────────────────────────────────────────
function App() {
  const [currentUser,   setCurrentUser]   = useState(()=>loadSession());
  const [bookings,      setBookings]      = useState([]);
  const [holidays,      setHolidays]      = useState([]);
  const [selectedRooms, setSelectedRooms] = useState(() => {
    const u = loadSession();
    if (u?.role === "cs") {
      const rid = CS_AGENT_MAP[u.email];
      return rid ? [rid] : [];
    }
    return ROOMS.map(r => r.id);
  });
  const [holidayOpen,   setHolidayOpen]   = useState(false);
  const [baseDate,      setBaseDate]      = useState(new Date());
  const [modalOpen,     setModalOpen]     = useState(false);
  const [modalInit,     setModalInit]     = useState(null);
  const [detailBooking, setDetailBooking] = useState(null);
  const [notifOpen,     setNotifOpen]     = useState(false);
  const [notifLogs,     setNotifLogs]     = useState(() => { const s = loadSession(); return s ? loadNotifLogs(s.id) : []; });
  const [loading,       setLoading]       = useState(false);
  const [accountOpen,   setAccountOpen]   = useState(false);
  const { toasts, add: addToast } = useToast();

  const weekDays = useMemo(()=>getWeekDays(baseDate),[baseDate]);

  // Load semua bookings dari Supabase
  const loadBookings = useCallback(async () => {
    setLoading(true);
    try {
      const data = await supa.get("bookings", { select: "*", order: "date.asc,start_time.asc" });
      setBookings(data);
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal memuat data", message:e.message, color:"#ef4444" });
    }
    setLoading(false);
  }, []);

  const loadHolidays = useCallback(async () => {
    try {
      const data = await supa.get("holidays", { select: "*", order: "date.asc" });
      setHolidays(data);
    } catch(e) { console.warn("Gagal load holidays:", e.message); }
  }, []);

  // Auto-load saat login
  useEffect(()=>{ if (currentUser) { loadBookings(); loadHolidays(); } },[currentUser]);

  // Realtime — poll setiap 30 detik sebagai fallback
  useEffect(()=>{
    if (!currentUser) return;
    const interval = setInterval(loadBookings, 30000);
    return () => clearInterval(interval);
  },[currentUser]);

  const login = user => {
    saveSession(user);
    setCurrentUser(user);
    setNotifLogs(loadNotifLogs(user.id));
    if (user.role === "cs") {
      const rid = CS_AGENT_MAP[user.email];
      setSelectedRooms(rid ? [rid] : []);
    } else {
      setSelectedRooms(ROOMS.map(r => r.id));
    }
  };
  const logout = () => { saveSession(null); setCurrentUser(null); setBookings([]); setNotifLogs([]); };
  const updateUser = user => { saveSession(user); setCurrentUser(user); };

  const notify = (type, booking) => {
    const room  = ROOMS.find(r=>r.id===booking.room_id);
    const icons = {create:"✅",update:"✏️",delete:"🗑️"};
    const titles= {create:"Booking Berhasil",update:"Booking Diperbarui",delete:"Booking Dihapus"};
    const entry = {id:Date.now(),ts:Date.now(),icon:icons[type],title:titles[type],
      message:`"${booking.title}" — ${room?.name} · ${booking.date} · ${booking.start_time}–${booking.end_time}`,
      read: false};
    setNotifLogs(p => {
      const updated = [...p, entry];
      if (currentUser) saveNotifLogs(currentUser.id, updated);
      return updated;
    });
    addToast({icon:icons[type],title:titles[type],message:`${booking.title} di ${room?.name}`,color:room?.colorHex});
  };

  const markAllRead = () => {
    const updated = notifLogs.map(l => ({...l, read: true}));
    setNotifLogs(updated);
    if (currentUser) saveNotifLogs(currentUser.id, updated);
  };

  const clearAllNotifs = () => {
    setNotifLogs([]);
    if (currentUser) saveNotifLogs(currentUser.id, []);
  };

  // Untuk CS role: room yang terkunci ke agent mereka
  const csRoomId = currentUser?.role === "cs" ? CS_AGENT_MAP[currentUser.email] : null;

  const toggleRoom = id => {
    if (currentUser?.role === "cs") return; // CS tidak bisa ubah filter
    setSelectedRooms(p => p.includes(id) ? (p.length>1 ? p.filter(r=>r!==id) : p) : [...p,id]);
  };

  const prevWeek = ()=>{ const d=new Date(baseDate); d.setDate(d.getDate()-7); setBaseDate(d); };
  const nextWeek = ()=>{ const d=new Date(baseDate); d.setDate(d.getDate()+7); setBaseDate(d); };

  const openNew = (date, startTime) => {
    const defaultRoom = csRoomId || selectedRooms[0] || ROOMS[0].id;
    setModalInit({room_id: defaultRoom, title:"", date:date||todayStr(),
      start_time:startTime||"09:00", end_time:startTime?addHour(startTime):"10:00",
      attendees:"", notes:"", visit_type:"Online", activity:""});
    setModalOpen(true);
  };
  const openEdit = b => { setDetailBooking(null); setModalInit({...b}); setModalOpen(true); };

  const handleSave = async data => {
    try {
      if (data.id) {
        const updated = await supa.update("bookings", data.id, {
          room_id: data.room_id, title: data.title, date: data.date,
          start_time: data.start_time, end_time: data.end_time,
          attendees: data.attendees, notes: data.notes,
          booked_by_name: data.booked_by_name, booked_by_email: data.booked_by_email,
          visit_type: data.visit_type || "Online", activity: data.activity || "",
          status_jadwal: data.status_jadwal || "",
          status_assignment: data.status_assignment || "Need Assign CRM",
        });
        setBookings(p=>p.map(b=>b.id===data.id?(updated[0]||data):b));
        notify("update", data);
      } else {
        const newId = "bk-"+Date.now();
        const inserted = await supa.insert("bookings", {
          id: newId, room_id: data.room_id, title: data.title, date: data.date,
          start_time: data.start_time, end_time: data.end_time,
          attendees: data.attendees||"", notes: data.notes||"",
          booked_by_name: data.booked_by_name, booked_by_email: data.booked_by_email,
          visit_type: data.visit_type || "Online", activity: data.activity || "",
          status_jadwal: data.status_jadwal || "",
          status_assignment: "Need Assign CRM",
        });
        setBookings(p=>[...p, inserted[0]||{...data,id:newId}]);
        notify("create", data);
        // Email notifikasi booking dinonaktifkan
      }
      setModalOpen(false);
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal menyimpan", message:e.message, color:"#ef4444" });
    }
  };

  const handleDelete = async id => {
    try {
      const b = bookings.find(b=>b.id===id);
      await supa.delete("bookings", id);
      setBookings(p=>p.filter(b=>b.id!==id));
      setModalOpen(false);
      setDetailBooking(null);
      if (b) notify("delete", b);
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal menghapus", message:e.message, color:"#ef4444" });
    }
  };

  // Update status field saja (status_jadwal atau status_assignment)
  const handleUpdateStatus = async (id, fields) => {
    try {
      const r = await fetch(`${SUPA_URL}/rest/v1/bookings?id=eq.${id}`, {
        method: "PATCH",
        headers: { ...supa.headers, "Prefer": "return=representation" },
        body: JSON.stringify(fields),
      });
      if (!r.ok) throw new Error(await r.text());
      const updated = await r.json();
      setBookings(p => p.map(b => b.id === id ? { ...b, ...fields } : b));
      setDetailBooking(p => p ? { ...p, ...fields } : p);
      addToast({ icon:"✅", title:"Status diperbarui", message: Object.values(fields)[0], color:"#10b981" });
    } catch(e) {
      addToast({ icon:"❌", title:"Gagal update status", message:e.message, color:"#ef4444" });
    }
  };

  if (!currentUser) return <LoginScreen onLogin={login}/>;

  const todayCount = bookings.filter(b=>b.date===todayStr()).length;

  return (
    <div className="flex flex-col h-screen overflow-hidden">
      <header className="bg-white border-b border-slate-200 px-5 py-2.5 flex items-center gap-3 flex-shrink-0 shadow-sm">
        <div className="flex items-center gap-2.5">
          <svg width="80" height="24" viewBox="0 0 600 180" fill="none" xmlns="http://www.w3.org/2000/svg">
